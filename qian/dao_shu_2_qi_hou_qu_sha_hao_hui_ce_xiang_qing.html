<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒数数据2期数两球球组合合后区区杀号号回测测结果</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js"></script>
  <script src="js/theme-toggle.js"></script>
  <style>
    .period-input {
      width: 80px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }
    .period-input::-webkit-inner-spin-button,
    .period-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    body.dark-theme .period-input {
      background-color: #2d2d2d;
      border-color: #444;
      color: #fff;
    }
    body.dark-theme .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航栏-->
      <div class="left-sidebar">
        <!-- 顶部快捷区-->
        <div class="top-bar">
          <div class="current-period">25120期数</div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
          </ul>
        </nav>
        
        <!-- 期数数据选择器-->
        <div class="period-selection" style="position: relative; top: -400px;">
          <h4 class="section-title">选择统计计范</h4>
          <select class="period-dropdown">
            <option selected>最低近100期数</option>
            <option>最低近50期数</option>
            <option>最低近35期数</option>
            <option>最低近200期数</option>
            <option>最低近300期数</option>
            <option>最低近500期数</option>
            <option>最低近1000期数</option>
            <option>全部期数</option>
          </select>
          <!-- 隐藏快捷期数数据按钮 -->
          <div class="quick-period-buttons" style="display: none;">
            <button class="quick-period-btn">全部期数</button>
            <button class="quick-period-btn">最低近100期数</button>
            <button class="quick-period-btn">最低近50期数</button>
          </div>
        </div>
        

      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">倒数数据2期数两球球组合合后区区杀号号回测测结果</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='dao_shu_2_qi_liang_qiu_zu_he.html'">返回测</button>
          </div>
        </div>
    
        <!-- 回测测期数数据和统计计期数数据选择 -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-start; flex-wrap: nowrap;">
          <div style="display: flex; align-items: flex-start; gap: 5px; white-space: nowrap;">
            <span style="line-height: 32px; white-space: nowrap;">回测测期数数据：</span>
            <select id="backtest-period" class="period-dropdown">
              <option value="100">最低近100期数</option>
              <option value="50">最低近50期数</option>
              <option value="35">最低近35期数</option>
              <option value="200">最低近200期数</option>
              <option value="300">最低近300期数</option>
              <option value="500">最低近500期数</option>
              <option value="1000">最低近1000期数</option>
              <option value="all">全部期数</option>
            </select>
          </div>
          <div style="display: flex; align-items: flex-start; gap: 5px; white-space: nowrap;">
            <span style="line-height: 32px; white-space: nowrap;">统计计期数数据：</span>
            <select id="stats-period" class="period-dropdown">
              <option value="100">最低近100期数</option>
              <option value="50">最低近50期数</option>
              <option value="35">最低近35期数</option>
              <option value="200">最低近200期数</option>
              <option value="300">最低近300期数</option>
              <option value="500">最低近500期数</option>
              <option value="1000">最低近1000期数</option>
              <option value="all">全部期数</option>
            </select>
            <input type="number" id="stats-period-input" class="period-input" placeholder="手动输入" min="1" max="5000">
          </div>
        </div>
    
    <!-- 回测测结果列表 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">杀号号回测测结果</h3>
          <div style="color: #DF2220;">
            <span id="backtestStats">共回测测期数，平均均正确率：0%</span>
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>当前区期数号</th>
                <th>后区区推荐杀号号</th>
                <th>推荐杀号号数据量</th>
                <th>下一期下一期期数开奖期数号</th>
                <th>下一期下一期期数实际开奖后区区</th>
                <th>正确杀号号</th>
                <th>错误杀号号</th>
                <th>是否成功杀号号</th>
              </tr>
            </thead>
            <tbody id="backtestResults">
              <!-- 数据据将通过JavaScript动态生成-->
              <tr>
                <td colspan="9" style="text-align: center; padding: 20px; color: #666;">加载中奖..</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 从URL参数据中奖获取回测测期数数据和统计计期数数据
    function getURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const backtestPeriod = urlParams.get('backtest_period') || '';
      const statsPeriod = urlParams.get('stats_period') || '';
      return { backtestPeriod, statsPeriod };
    }
    
    // 从后区端获取回测测数据?    async function huo_qu_dao_shu_2_qi_hou_qu_sha_hao_hui_ce(backtestPeriod = '100', statsPeriod = '100') {
      try {
        const response = await fetch(`http://localhost:18889/dao_shu_2_qi_hou_qu_sha_hao_hui_ce?backtest_period=${backtestPeriod}&stats_period=${statsPeriod}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          return result.data;
        } else {
          alert('获取回测测数据据失败败：' + result.message);
          return null;
        }
      } catch (error) {
        console.error('获取回测测数据据失败败:', error);
        alert('获取回测测数据据失败败');
        return null;
      }
    }
    
    // 渲染回测测数据据
    function renderBacktestData(backtestData) {
      const backtestResults = document.getElementById('backtestResults');
      const backtestStats = document.getElementById('backtestStats');
      
      if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
        backtestResults.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 20px; color: #666;">暂无回测测数据据</td></tr>';
        backtestStats.textContent = '共回测测0期数，平均均正确率：0%';
        return;
      }
      
      // 计算平均均正确率（成功杀号号次数据?总回测测期数数据）
      let successKillCount = 0;
      
      backtestData.backtestResults.forEach(result => {
        // 统计计成功杀号号次数据数据（错误杀号号为0?        if (result.backWrongKill === 0) {
          successKillCount++;
        }
      });
      
      const totalPeriods = backtestData.backtestResults.length;
      const averageCorrectRate = totalPeriods > 0 ? 
        ((successKillCount / totalPeriods) * 100).toFixed(2) : 0;
      
      // 更新统计计信息
      backtestStats.textContent = `共回测测${backtestData.backtestResults.length}期数，平均均正确率：${averageCorrectRate}%`;
      
      // 渲染回测测列表
      backtestResults.innerHTML = '';
      
      backtestData.backtestResults.forEach((result, index) => {
        const tr = document.createElement('tr');
        
        // 格式化后区区推荐杀号?        const backKillNumbersStr = result.backKillNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ');
        
        // 格式化下一期下一期期数实际开奖后区?        const nextNextBackNumbersStr = result.nextNextBackNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ');
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${result.currentIssue}</td>
          <td>${backKillNumbersStr}</td>
          <td>${result.backKillNumbers.length}</td>
          <td>${result.nextNextIssue}</td>
          <td>${nextNextBackNumbersStr}</td>
          <td style="color: green;">${result.backCorrectKill}</td>
          <td style="color: red;">${result.backWrongKill}</td>
          <td>
            ${result.backWrongKill === 0 ? 
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#4CAF50"/><path d="M7 12L10 15L17 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : 
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#F44336"/><path d="M8 8L16 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 8L8 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            }
          </td>
        `;
        
        backtestResults.appendChild(tr);
      });
    }
    
    // 获取并渲染回测测数据?    async function fetchAndRenderBacktestData(backtestPeriod = '100', statsPeriod = '100') {
      const backtestData = await huo_qu_dao_shu_2_qi_hou_qu_sha_hao_hui_ce(backtestPeriod, statsPeriod);
      renderBacktestData(backtestData);
    }
    
    // 保存回测测期数数据和统计计期数数据到localStorage
    function savePeriodSelection(backtestPeriod, statsPeriod) {
      try {
        localStorage.setItem('backtestPeriod', backtestPeriod);
        localStorage.setItem('statsPeriod', statsPeriod);
      } catch (e) {
        console.error('保存统计计范失败败:', e);
      }
    }
    
    // 从localStorage读取保存的回测测期数数据和统计计期数数据
    function getSavedPeriodSelection() {
      try {
        const backtestPeriod = localStorage.getItem('backtestPeriod') || '100';
        const statsPeriod = localStorage.getItem('statsPeriod') || '100';
        return { backtestPeriod, statsPeriod };
      } catch (e) {
        console.error('读取统计计范失败败:', e);
        return { backtestPeriod: '100', statsPeriod: '100' };
      }
    }
    
    // 页面加载完成后区渲染数据?    window.addEventListener('load', async function() {
      // 首先从URL参数据中奖获取回测测期数数据和统计计期数数据
      const urlParams = getURLParameters();
      
      // 获取保存的回测测期数数据和统计计期数数据
      const savedParams = getSavedPeriodSelection();
      
      // 使用URL参数据优先于保存的参数据，最低后区使用默认值?      const backtestPeriod = urlParams.backtestPeriod || savedParams.backtestPeriod || '50';
      const statsPeriod = urlParams.statsPeriod || savedParams.statsPeriod || '100';
      
      // 获取下一期拉选项元素
      const backtestPeriodSelect = document.getElementById('backtest-period');
      const statsPeriodSelect = document.getElementById('stats-period');
      const statsPeriodInput = document.getElementById('stats-period-input');
      
      // 设置下一期拉选项的初始?      backtestPeriodSelect.value = backtestPeriod;
      statsPeriodSelect.value = statsPeriod;
      
      // 保存选择的回测测期数数据和统计计期数数据到localStorage
      savePeriodSelection(backtestPeriod, statsPeriod);
      
      // 使用回测测期数数据和统计计期数数据获取回测测数据?      fetchAndRenderBacktestData(backtestPeriod, statsPeriod);
      
      // 为回测测期数数据下一期拉选择框添加事件监听器
      backtestPeriodSelect.addEventListener('change', function() {
        const newBacktestPeriod = this.value;
        const currentStatsPeriod = statsPeriodSelect.value;
        // 保存选择的回测测期数数据和统计计期数数据
        savePeriodSelection(newBacktestPeriod, currentStatsPeriod);
        // 根据选择的回测测期数数据和统计计期数数据重新获取回测测数据据
        fetchAndRenderBacktestData(newBacktestPeriod, currentStatsPeriod);
      });
      
      // 为统计计期数数据下一期拉选择框添加事件监听器
      statsPeriodSelect.addEventListener('change', function() {
        const newStatsPeriod = this.value;
        const currentBacktestPeriod = backtestPeriodSelect.value;
        // 保存选择的回测测期数数据和统计计期数数据
        savePeriodSelection(currentBacktestPeriod, newStatsPeriod);
        // 根据选择的回测测期数数据和统计计期数数据重新获取回测测数据据
        fetchAndRenderBacktestData(currentBacktestPeriod, newStatsPeriod);
      });
      
      // 处理手动输入统计计期数数据
      function handleManualStatsPeriodInput() {
        const inputValue = statsPeriodInput.value.trim();
        const currentBacktestPeriod = backtestPeriodSelect.value;
        
        if (inputValue) {
          const parsedValue = parseInt(inputValue, 10);
          if (!isNaN(parsedValue) && parsedValue >= 1 && parsedValue <= 5000) {
            // 设置下一期拉框为自定义?            statsPeriodSelect.value = parsedValue;
            // 保存选择
            savePeriodSelection(currentBacktestPeriod, parsedValue);
            // 重新获取数据据
            fetchAndRenderBacktestData(currentBacktestPeriod, parsedValue);
          }
        }
      }
      
      // 为手动输入框添加回测车事件
      statsPeriodInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          handleManualStatsPeriodInput();
        }
      });
      
      // 为手动输入框添加失败焦事件
      statsPeriodInput.addEventListener('blur', handleManualStatsPeriodInput);
    });
    
    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事?    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状?        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前区导航项的活动状?        this.classList.add('active');
        
        // 获取当前区点击项的文本内容
        const navText = this.textContent.trim();
        console.log('点击的导航项文本:', navText);
        
        // 使用更精确的匹配，优先检查特定的导航项        const navTextContent = this.querySelector('span:not(.nav-icon)') ? this.querySelector('span:not(.nav-icon)').textContent.trim() : this.querySelector('a').textContent.trim();
        console.log('点击的导航项文本:', navTextContent);
        
        if (navTextContent.includes('倒数数据3期数两球球')) {
          console.log('跳转到倒数数据3期数两球球组合合分析析页面');
          window.location.href = 'dao_shu_3_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数数据2期数三球球')) {
          console.log('跳转到倒数数据2期数三球球组合合分析析页面');
          window.location.href = 'dao_shu_2_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数数据3期数三球球')) {
          console.log('跳转到倒数数据3期数三球球组合合分析析页面');
          window.location.href = 'dao_shu_3_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('三球球')) {
          console.log('跳转到最低近期数三球球组合合分析析页面');
          window.location.href = 'san_qiu_fen_xi.html';
        } else if (navTextContent.includes('倒数数据2期数两球球')) {
          console.log('跳转到倒数数据2期数两球球组合合分析析页面');
          window.location.href = 'dao_shu_2_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('两球球组合合分析析')) {
          console.log('跳转到最低近期数两球球组合合分析析页面');
          window.location.href = 'zu_he_xiang_qing.html';
        } else if (navTextContent.includes('两球球')) {
          console.log('跳转到最低近期数两球球组合合分析析页面');
          window.location.href = 'sha_hao_fen_xi.html';
        }
        
        // 在移动端点击导航后区关闭侧边栏
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      });
    });
  </script>
</body>
</html>
