  <script>
    // 从sql_zui_xin_yi_qi接口获取最新一期开奖信息
    async function huo_qu_sql_zui_xin_yi_qi() {
      try {
        // 调用d:\中啦\caishen4\hou\sql_zui_xin_yi_qi.js对应的接口
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        
        if (!response.ok) {
          console.error('接口请求失败，状态码:', response.status);
          return null;
        }
        
        const result = await response.json();
        console.log('sql_zui_xin_yi_qi接口返回数据:', result);
        
        // 确保正确处理后端返回的success和latestDraw结构
        if (result && result.success && result.latestDraw) {
          return result.latestDraw;
        } else {
          console.error('接口返回数据格式不正确:', result);
          return null;
        }
      } catch (error) {
        console.error('获取最新一期开奖数据失败:', error);
        return null;
      }
    }

        if (result && result.success && result.secondLastDraw) {

        } else {

      }
    }
    
    // 渲染最新一期开奖信息到新增的区域
    async function xuan_ran_sql_zui_xin_yi_qi() {
      const latestDraw = await huo_qu_sql_zui_xin_yi_qi();
      const latestDrawInfoElement = document.getElementById('latestDrawInfo');
      
      if (!latestDraw) {
        if (latestDrawInfoElement) {
          latestDrawInfoElement.innerHTML = '<div style="color: #DF2220; font-weight: bold;">接口失败</div>';
        }
        return;
      }
      
      // 处理日期格式，只显示年月日
      let formattedDate = latestDraw.drawDate;
      if (formattedDate && typeof formattedDate === 'string') {
        // 处理ISO格式日期
        if (formattedDate.includes('T')) {
          formattedDate = formattedDate.split('T')[0];
        } else if (formattedDate.includes(' ')) {
          formattedDate = formattedDate.split(' ')[0];
        }
      }
      
      // 更新顶部快捷栏的期数显示
      if (latestDraw.period && window.updateCurrentPeriod) {
        updateCurrentPeriod(latestDraw.period);
      }
      
      if (latestDrawInfoElement) {
        latestDrawInfoElement.innerHTML = `
          <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
            期号: ${latestDraw.period}
          </div>
          <div>
            开奖日期: ${formattedDate}
          </div>
          <div>
            前区号码: ${Array.isArray(latestDraw.firstZoneNumbers) ? latestDraw.firstZoneNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ') : ''}
          </div>
          <div>
            后区号码: ${Array.isArray(latestDraw.lastZoneNumbers) ? latestDraw.lastZoneNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ') : ''}
          </div>`;
      }
    }

          console.error('HTTP错误，状态码:', response.status);

        const result = await response.json();
        console.log('获取到接口返回数据:', result);

      } catch (error) {
        console.error('获取开奖数据失败:', error);

        return null;

    // 导航项点击事件 - 只处理没有<a>标签的导航项，避免与默认<a>标签事件冲突
    document.querySelectorAll('.nav-item').forEach(item => {

      item.addEventListener('click', function() {

        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');

        this.classList.add('active');

        const navText = this.textContent.trim();

    <!-- 核心功能：最新开奖信息展示 -->
    <script>
      // 确保DOM完全加载后再执行
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM已完全加载，开始初始化最新开奖信息功能');
        
        // 删除刷新按钮功能
        
        // 加载最新开奖信息
        function loadLatestDrawInfo() {
          console.log('开始加载最新开奖信息...');
          
          // 先更新UI显示加载中状态
          const infoBox = document.getElementById('latestDrawInfoBoxContent');
          if (infoBox) {
            infoBox.innerHTML = '<div style="color: #DF2220; font-weight: bold;">加载中...</div>';
          } else {
            console.error('未找到latestDrawInfoBoxContent元素');
          }
          
          // 使用简单的fetch调用，添加超时处理
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时
          
          fetch('http://localhost:18889/sql_zui_xin_yi_qi', {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json'
            },
            signal: controller.signal
          })
          .then(response => {
            clearTimeout(timeoutId);
            console.log('fetch响应状态:', response.status, '响应类型:', response.type);
            if (!response.ok) {
              throw new Error(`HTTP错误! 状态: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            console.log('成功获取开奖数据:', JSON.stringify(data));
            
            // 更新UI显示数据
            const infoBox = document.getElementById('latestDrawInfoBoxContent');
            if (infoBox) {
              if (data && data.success && data.latestDraw) {
                const draw = data.latestDraw;
                // 处理日期格式
                let formattedDate = draw.drawDate || '-';
                if (formattedDate && typeof formattedDate === 'string') {
                  if (formattedDate.includes('T')) {
                    formattedDate = formattedDate.split('T')[0];
                  } else if (formattedDate.includes(' ')) {
                    formattedDate = formattedDate.split(' ')[0];
                  }
                }
                
                infoBox.innerHTML = `
                <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
                  期号: ${draw.period}
                </div>
                <div>
                  开奖日期: ${formattedDate}
                </div>
                <div>
                  前区号码: ${Array.isArray(draw.firstZoneNumbers) ? draw.firstZoneNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ') : '-'}
                </div>
                <div>
                  后区号码: ${Array.isArray(draw.lastZoneNumbers) ? draw.lastZoneNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ') : '-'}
                </div>
                `;
              } else {
                infoBox.innerHTML = '<div style="color: #DF2220;">暂无开奖数据</div>';
                console.warn('返回的数据格式不正确或无数据:', data);
              }
            }
          })
          .catch(error => {
            clearTimeout(timeoutId);
            console.error('获取开奖信息失败:', error.name, error.message);
            
            // 更新UI显示错误信息
            const infoBox = document.getElementById('latestDrawInfoBoxContent');
            if (infoBox) {
              infoBox.innerHTML = '<div style="color: #DF2220;">接口失败</div>';
            }
            
            // 显示错误提示
            alert('接口失败: ' + (error.message || '未知错误'));
          });
        }
        
        // 延迟一秒后加载数据，确保页面元素都已渲染
        setTimeout(() => {
          console.log('延迟加载最新开奖信息...');
          loadLatestDrawInfo();
        }, 1000);
      });
    </script>
