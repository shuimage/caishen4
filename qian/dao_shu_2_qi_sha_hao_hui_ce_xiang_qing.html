</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航栏 -->

        <!-- 顶部快捷栏 -->

        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
            <li class="nav-item">

            </li>
            <li class="nav-item active">
              <span class="nav-icon">✖️</span>
              <span onclick="window.location.href='dao_shu_2_qi_liang_qiu_zu_he.html'">倒数2期两球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">✗</span>
              <a href="dao_shu_3_qi_liang_qiu_zu_he.html" style="text-decoration: none; color: inherit;">倒数3期两球组合分析</a>
            </li>
            <li class="nav-item">
              <span class="nav-icon">🔺</span>
              <span onclick="window.location.href='/san_qiu_fen_xi.html'">最新1期三球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">🔻</span>
              <span onclick="window.location.href='dao_shu_2_qi_san_qiu_zu_he.html'">倒数2期三球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">🔹</span>
              <a href="dao_shu_3_qi_san_qiu_zu_he.html" style="text-decoration: none; color: inherit;">倒数3期三球组合分析</a>
            </li>
          </ul>
        </nav>
        
        <!-- 期数选择区 -->
        <div class="period-selection" style="position: relative; top: -400px;">
          <h4 class="section-title">选择统计范围</h4>
          <select class="period-dropdown">
            <option selected>最近100期</option>

      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">倒数2期两球组合前区杀号回测结果</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='dao_shu_2_qi_liang_qiu_zu_he.html'">返回</button>

        <!-- 回测期数和统计期数选择 -->
        <div style="display: flex; gap: 20px; margin-bottom: 20px; align-items: center;">
          <div style="display: flex; align-items: center; gap: 5px;">
            <span>回测期数：</span>
            <select id="backtest-period" class="period-dropdown">
              <option value="100">最近100期</option>
              <option value="50">最近50期</option>

            </select>

          <div style="display: flex; align-items: center; gap: 5px;">
            <span>统计期数：</span>
            <select id="stats-period" class="period-dropdown">
              <option value="100">最近100期</option>
              <option value="50">最近50期</option>
              <option value="35">最近35期</option>
              <option value="200">最近200期</option>
              <option value="300">最近300期</option>
              <option value="500">最近500期</option>
              <option value="1000">最近1000期</option>
              <option value="all">全部期</option>
            </select>
          </div>
        </div>

        <!-- 回测结果列表 -->
        <div class="section">
          <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">杀号回测结果</h3>
            <div style="color: #DF2220;">
              <span id="backtestStats">共回测0期，平均正确率：0%</span>
            </div>
          </div>
          <div style="overflow-x: auto;">
            <table class="combination-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>当前回测期号</th>
                  <th>前区推荐杀号</th>
                  <th>下下期开奖期号</th>
                  <th>下下期实际开奖前区</th>
                  <th>前区正确杀号</th>
                  <th>前区错误杀号</th>
                </tr>
              </thead>
              <tbody id="backtestResults">
                <!-- 数据将通过JavaScript动态生成 -->
                <tr>
                  <td colspan="7" style="text-align: center; padding: 20px; color: #666;">加载中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 获取URL参数
    function getURLParameters() {
      const params = {};
      const search = window.location.search;
      if (search) {
        const queryString = search.substring(1);
        const pairs = queryString.split('&');
        pairs.forEach(pair => {
          const [key, value] = pair.split('=');
          if (key && value) {
            params[decodeURIComponent(key)] = decodeURIComponent(value);
          }
        });
      }
      return params;
    }

    // 从后端获取回测数据
    async function huo_qu_dao_shu_2_qi_sha_hao_hui_ce(backtest_period = '100', stats_period = '100') {
      try {
        const response = await fetch(`http://localhost:18889/dao_shu_2_qi_sha_hao_hui_ce?backtest_period=${backtest_period}&stats_period=${stats_period}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          return result.data;
        } else {
          alert('获取回测数据失败：' + result.message);
          return null;
        }
      } catch (error) {
        console.error('获取回测数据失败:', error);
        alert('获取回测数据失败');
        return null;
      }
    }
    
    // 渲染回测数据
    function renderBacktestData(backtestData) {
      const backtestResults = document.getElementById('backtestResults');
      const backtestStats = document.getElementById('backtestStats');
      
      if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
        backtestResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #666;">暂无回测数据</td></tr>';
        backtestStats.textContent = '共回测0期，平均正确率：0%';
        return;
      }
      
      // 计算平均正确率
      let totalFrontCorrectKill = 0;
      let totalFrontKillNumbers = 0;
      
      backtestData.backtestResults.forEach(result => {
        totalFrontCorrectKill += result.frontCorrectKill;
        totalFrontKillNumbers += result.frontKillNumbers.length;
      });
      
      const averageCorrectRate = totalFrontKillNumbers > 0 ? 
        ((totalFrontCorrectKill / totalFrontKillNumbers) * 100).toFixed(2) : 0;
      
      // 更新统计信息
      backtestStats.textContent = `共回测${backtestData.backtestResults.length}期，平均正确率：${averageCorrectRate}%`;
      
      // 渲染回测列表
      backtestResults.innerHTML = '';
      
      backtestData.backtestResults.forEach((result, index) => {
        const tr = document.createElement('tr');
        
        // 格式化前区推荐杀号
        const frontKillNumbersStr = result.frontKillNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
        
        // 格式化下下期实际开奖前区
        const nextNextFrontNumbersStr = result.nextNextFrontNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${result.currentIssue}</td>
          <td>${frontKillNumbersStr}</td>
          <td>${result.nextNextIssue}</td>
          <td>${nextNextFrontNumbersStr}</td>
          <td style="color: green;">${result.frontCorrectKill}</td>
          <td style="color: red;">${result.frontWrongKill}</td>
        `;
        
        backtestResults.appendChild(tr);
      });
    }
    
    // 获取并渲染回测数据
    async function fetchAndRenderBacktestData(backtest_period = '100', stats_period = '100') {
      const backtestData = await huo_qu_dao_shu_2_qi_sha_hao_hui_ce(backtest_period, stats_period);
      renderBacktestData(backtestData);
    }
    
    // 保存统计范围到localStorage
    function savePeriodSelection(backtest_period, stats_period) {
      try {
        localStorage.setItem('selectedBacktestPeriod', backtest_period);
        localStorage.setItem('selectedStatsPeriod', stats_period);
      } catch (e) {
        console.error('保存统计范围失败:', e);
      }
    }
    
    // 从localStorage读取保存的统计范围
    function getSavedPeriodSelection() {
      try {
        return {
          backtest_period: localStorage.getItem('selectedBacktestPeriod') || '100',
          stats_period: localStorage.getItem('selectedStatsPeriod') || '100'
        };
      } catch (e) {
        console.error('读取统计范围失败:', e);
        return {
          backtest_period: '100',
          stats_period: '100'
        };
      }
    }
    
    // 定义全局变量用于存储当前选择的统计范围
    let backtest_period = '100'; // 默认值
    let stats_period = '100'; // 默认值
    
    // 页面加载完成后渲染数据
    window.addEventListener('load', async function() {
      // 获取URL参数
      const urlParams = getURLParameters();
      
      // 获取保存的统计范围，如果URL中有参数则优先使用URL参数
      const savedParams = getSavedPeriodSelection();
      backtest_period = urlParams.backtest_period || savedParams.backtest_period;
      stats_period = urlParams.stats_period || savedParams.stats_period;
      
      // 设置下拉框选中状态
      const backtestDropdown = document.getElementById('backtest-period');
      const statsDropdown = document.getElementById('stats-period');
      
      if (backtestDropdown) {
        backtestDropdown.value = backtest_period;
      }
      
      if (statsDropdown) {
        statsDropdown.value = stats_period;
      }
      
      // 使用保存的统计范围获取回测数据
      fetchAndRenderBacktestData(backtest_period, stats_period);
      
      // 为回测期数下拉选择框添加事件监听器
      if (backtestDropdown) {
        backtestDropdown.addEventListener('change', function() {
          backtest_period = this.value;
          // 保存选择的统计范围
          savePeriodSelection(backtest_period, stats_period);
          // 根据选择的统计范围重新获取回测数据
          fetchAndRenderBacktestData(backtest_period, stats_period);
        });
      }
      
      // 为统计期数下拉选择框添加事件监听器
      if (statsDropdown) {
        statsDropdown.addEventListener('change', function() {
          stats_period = this.value;
          // 保存选择的统计范围
          savePeriodSelection(backtest_period, stats_period);
          // 根据选择的统计范围重新获取回测数据
          fetchAndRenderBacktestData(backtest_period, stats_period);
        });
      }
    });

    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事件 - 只处理没有<a>标签的导航项，避免与默认<a>标签事件冲突
    document.querySelectorAll('.nav-item').forEach(item => {
      // 检查当前导航项是否包含<a>标签，如果包含则跳过，使用<a>标签的默认行为
      const hasLink = item.querySelector('a') !== null;
      if (hasLink) {
        return; // 跳过包含<a>标签的导航项
      }
      
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状态
        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前导航项的活动状态
        this.classList.add('active');
        
        // 获取当前点击项的文本内容
        const navText = this.textContent.trim();
        console.log('点击的导航项文本:', navText);
        
        // 使用更精确的匹配，优先检查特定的导航项
        const navTextContent = this.querySelector('span:not(.nav-icon)') ? this.querySelector('span:not(.nav-icon)').textContent.trim() : '';
        console.log('点击的导航项文本:', navTextContent);
        
        if (navTextContent.includes('倒数3期两球')) {
          console.log('跳转到倒数3期两球组合分析页面');
          window.location.href = 'dao_shu_3_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数2期三球')) {
          console.log('跳转到倒数2期三球组合分析页面');
          window.location.href = 'dao_shu_2_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数3期三球')) {
          console.log('跳转到倒数3期三球组合分析页面');
          window.location.href = 'dao_shu_3_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('三球')) {
          console.log('跳转到最新1期三球组合分析页面');
          window.location.href = 'san_qiu_fen_xi.html';
        } else if (navTextContent.includes('倒数2期两球')) {
          console.log('跳转到倒数2期两球组合分析页面');
          window.location.href = 'dao_shu_2_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('两球组合分析')) {
          console.log('跳转到最新1期两球组合分析页面');
          window.location.href = 'zu_he_xiang_qing.html';
        } else if (navTextContent.includes('两球')) {
          console.log('跳转到最新1期两球组合分析页面');
          window.location.href = 'sha_hao_fen_xi.html';
        }
        
        // 在移动端点击导航后关闭侧边栏
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      });
    });
  </script>
</body>
