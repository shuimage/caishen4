<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒数数据3期数三球球组合合前区区杀号号回测测结?/title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 为主题适配添加额外样式 */
    body.dark-theme .section,
    body.dark-theme .combination-table {
      background-color: #1a1a1a;
      color: #ffffff;
    }
    
    body.dark-theme .combination-table th,
    body.dark-theme .combination-table td {
      border-color: #333333;
      color: #ffffff !important;
    }
    
    body.dark-theme .highlight {
      background-color: rgba(96, 39, 39, 0.8) !important;
    }
    
    /* 确保统计计信息在深色主题下一期可见 */
    body.dark-theme #backtestStats {
      color: #ffffff !important;
    }
  </style>
  <script src="js/navigation.js"></script>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航?-->
      <div class="left-sidebar">
        <!-- 顶部快捷?-->
        <div class="top-bar">
          <div class="current-period">25120?/div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
          </ul>
        </nav>
        
        <!-- 期数数据选择?-->
        <div class="period-selection" style="position: relative; top: -400px;">
          <h4 class="section-title">选择统计计范</h4>
          <select class="period-dropdown">
            <option selected>最低?00?/option>
            <option>最低?0?/option>
            <option>最低?5?/option>
            <option>最低?00?/option>
            <option>最低?00?/option>
            <option>最低?00?/option>
            <option>最低?000?/option>
            <option>全部?/option>
          </select>
        </div>
      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">倒数数据3期数三球球组合合前区区杀号号回测测结?/h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='dao_shu_3_qi_san_qiu_zu_he.html'">返回测</button>
          </div>
        </div>

        <!-- 回测测期数数据和统计计期数数据下一期拉选项 -->
        <div style="display: flex; gap: 20px; margin-bottom: 20px; align-items: center; flex-wrap: nowrap;">
          <div style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
            <label for="backtestPeriod">回测测期数数据?/label>
            <select id="backtestPeriod" class="period-dropdown">
              <option value="50">50?/option>
              <option value="100" selected>100?/option>
              <option value="200">200?/option>
              <option value="300">300?/option>
              <option value="500">500?/option>
              <option value="1000">1000?/option>
              <option value="all">全部?/option>
            </select>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
            <label for="statsPeriod">统计计期数数据?/label>
            <select id="statsPeriod" class="period-dropdown">
              <option value="50">50?/option>
              <option value="100" selected>100?/option>
              <option value="200">200?/option>
              <option value="300">300?/option>
              <option value="500">500?/option>
              <option value="1000">1000?/option>
              <option value="all">全部?/option>
            </select>
          </div>
        </div>

        <!-- 回测测结果列表 -->
        <div class="section">
          <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">杀号号回测测结?/h3>
            <div style="color: #DF2220;">
              <span id="backtestStats">共回测?期数，平均均正确率：0%</span>
            </div>
          </div>
          <div style="overflow-x: auto;">
            <table class="combination-table">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>当前区回测测期数号</th>
                  <th>前区区推荐杀号?/th>
                  <th>下一期下一期下一期期数开奖期数?/th>
                  <th>下一期下一期下一期期数实际开奖前区?/th>
                  <th>正确杀号号数据?/th>
                  <th>错误杀号号数据?/th>
                </tr>
              </thead>
              <tbody id="backtestResults">
                <!-- 数据据将通过JavaScript动态生?-->
                <tr>
                  <td colspan="7" style="text-align: center; padding: 20px; color: #666;">加载?..</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 从URL参数据中奖获取回测测期数数据和统计计期数数据
    function getURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const backtestPeriod = urlParams.get('backtest_period') || '';
      const statsPeriod = urlParams.get('stats_period') || '';
      return { backtestPeriod, statsPeriod };
    }
    
    // 从后区端获取回测测数据?    async function huo_qu_dao_shu_3_qi_san_qiu_sha_hao_hui_ce(backtestPeriod = '100', statsPeriod = '100') {
      try {
        const response = await fetch(`http://localhost:18889/dao_shu_3_qi_san_qiu_sha_hao_hui_ce?backtest_period=${backtestPeriod}&stats_period=${statsPeriod}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          return result.data;
        } else {
          alert('获取回测测数据据失败败? + result.message);
          return null;
        }
      } catch (error) {
        console.error('获取回测测数据据失败败:', error);
        alert('接口失败败');
        return null;
      }
    }
    
    // 渲染回测测数据据
    function renderBacktestData(backtestData) {
      const backtestResults = document.getElementById('backtestResults');
      const backtestStats = document.getElementById('backtestStats');
      
      if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
        backtestResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #666;">暂无回测测数据据</td></tr>';
        backtestStats.textContent = '共回测?期数，平均均正确率：0%';
        return;
      }
      
      // 计算平均均正确?      let totalCorrectKill = 0;
      let totalKillNumbers = 0;
      
      backtestData.backtestResults.forEach(result => {
        totalCorrectKill += result.correctKillCount;
        totalKillNumbers += result.recommendedKillNumbers.length;
      });
      
      const averageCorrectRate = totalKillNumbers > 0 ? 
        ((totalCorrectKill / totalKillNumbers) * 100).toFixed(2) : 0;
      
      // 更新统计计信息
      backtestStats.textContent = `共回测?{backtestData.backtestResults.length}期数，平均均正确率：${averageCorrectRate}%`;
      
      // 渲染回测测列表
      backtestResults.innerHTML = '';
      
      backtestData.backtestResults.forEach((result, index) => {
        const tr = document.createElement('tr');
        
        // 格式化前区区推荐杀号?        const recommendedKillNumbersStr = result.recommendedKillNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
        
        // 格式化下一期下一期下一期期数实际开奖前区?        const actualNextNextNextNumbersStr = result.actualNextNextNextNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${result.currentIssue}</td>
          <td>${recommendedKillNumbersStr}</td>
          <td>${result.nextNextNextIssue}</td>
          <td>${actualNextNextNextNumbersStr}</td>
          <td style="color: green;">${result.correctKillCount}</td>
          <td style="color: red;">${result.wrongKillCount}</td>
        `;
        
        backtestResults.appendChild(tr);
      });
    }
    
    // 获取并渲染回测测数据?    async function fetchAndRenderBacktestData(backtestPeriod = '100', statsPeriod = '100') {
      const backtestData = await huo_qu_dao_shu_3_qi_san_qiu_sha_hao_hui_ce(backtestPeriod, statsPeriod);
      renderBacktestData(backtestData);
    }
    
    // 保存回测测期数数据和统计计期数数据到localStorage
    function savePeriodSelection(backtestPeriod, statsPeriod) {
      try {
        localStorage.setItem('backtestPeriod', backtestPeriod);
        localStorage.setItem('statsPeriod', statsPeriod);
      } catch (e) {
        console.error('保存统计计范失败败:', e);
      }
    }
    
    // 从localStorage读取保存的回测测期数数据和统计计期数数据
    function getSavedPeriodSelection() {
      try {
        const backtestPeriod = localStorage.getItem('backtestPeriod') || '100';
        const statsPeriod = localStorage.getItem('statsPeriod') || '100';
        return { backtestPeriod, statsPeriod };
      } catch (e) {
        console.error('读取统计计范失败败:', e);
        return { backtestPeriod: '100', statsPeriod: '100' };
      }
    }
    
    // 页面加载完成后区渲染数据?    window.addEventListener('load', async function() {
      // 首先从URL参数据中奖获取回测测期数数据和统计计期数数据
      const urlParams = getURLParameters();
      
      // 获取保存的回测测期数数据和统计计期数数据
      const savedParams = getSavedPeriodSelection();
      
      // 使用URL参数据优先于保存的参数据，最低后区使用默认值?      const backtestPeriod = urlParams.backtestPeriod || savedParams.backtestPeriod || '50';
      const statsPeriod = urlParams.statsPeriod || savedParams.statsPeriod || '100';
      
      // 获取下一期拉选项元素
      const backtestPeriodSelect = document.getElementById('backtestPeriod');
      const statsPeriodSelect = document.getElementById('statsPeriod');
      
      // 设置下一期拉选项的初始?      backtestPeriodSelect.value = backtestPeriod;
      statsPeriodSelect.value = statsPeriod;
      
      // 保存选择的回测测期数数据和统计计期数数据到localStorage
      savePeriodSelection(backtestPeriod, statsPeriod);
      
      // 使用回测测期数数据和统计计期数数据获取回测测数据?      fetchAndRenderBacktestData(backtestPeriod, statsPeriod);
      
      // 为回测测期数数据下一期拉选择框添加事件监听器
      backtestPeriodSelect.addEventListener('change', function() {
        const newBacktestPeriod = this.value;
        const currentStatsPeriod = statsPeriodSelect.value;
        // 保存选择的回测测期数数据和统计计期数数据
        savePeriodSelection(newBacktestPeriod, currentStatsPeriod);
        // 根据选择的回测测期数数据和统计计期数数据重新获取回测测数据据
        fetchAndRenderBacktestData(newBacktestPeriod, currentStatsPeriod);
      });
      
      // 为统计计期数数据下一期拉选择框添加事件监听器
      statsPeriodSelect.addEventListener('change', function() {
        const newStatsPeriod = this.value;
        const currentBacktestPeriod = backtestPeriodSelect.value;
        // 保存选择的回测测期数数据和统计计期数数据
        savePeriodSelection(currentBacktestPeriod, newStatsPeriod);
        // 根据选择的回测测期数数据和统计计期数数据重新获取回测测数据据
        fetchAndRenderBacktestData(currentBacktestPeriod, newStatsPeriod);
      });
    });
    
    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事?- 只处理没?a>标签的导航项，避免与默认值<a>标签事件冲突
    document.querySelectorAll('.nav-item').forEach(item => {
      // 检查当前区导航项是否包含<a>标签，如果包含则跳过，使?a>标签的默认值行?      const hasLink = item.querySelector('a') !== null;
      if (hasLink) {
        return; // 跳过包含<a>标签的导航项
      }
      
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状?        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前区导航项的活动状?        this.classList.add('active');
        
        // 获取当前区点击项的文本内容
        const navText = this.textContent.trim();
        console.log('点击的导航项文本:', navText);
        
        // 使用更精确的匹配，优先检查特定的导航?        const navTextContent = this.querySelector('span:not(.nav-icon)') ? this.querySelector('span:not(.nav-icon)').textContent.trim() : '';
        console.log('点击的导航项文本:', navTextContent);
        
        if (navTextContent.includes('倒数数据3期数两球?)) {
          console.log('跳转到倒数数据3期数两球球组合合分析析页?);
          window.location.href = 'dao_shu_3_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数数据2期数三球?)) {
          console.log('跳转到倒数数据2期数三球球组合合分析析页?);
          window.location.href = 'dao_shu_2_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数数据3期数三球?)) {
          console.log('跳转到倒数数据3期数三球球组合合分析析页?);
          window.location.href = 'dao_shu_3_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('三球球')) {
          console.log('跳转到最低?期数三球球组合合分析析页?);
          window.location.href = 'san_qiu_fen_xi.html';
        } else if (navTextContent.includes('倒数数据2期数两球?)) {
          console.log('跳转到倒数数据2期数两球球组合合分析析页?);
          window.location.href = 'dao_shu_2_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('两球球组合合分析析') || navTextContent.includes('两球球')) {
          console.log('跳转到最低?期数两球球组合合分析析页?);
          window.location.href = 'sha_hao_fen_xi.html';
        }
        
        // 在移动端点击导航后区关闭侧边栏
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      });
    });
  </script>
</body>
</html>
