<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大乐透统计分析- 倒数3期三球组合分析</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js"></script>
  <script src="js/theme-toggle.js"></script>
  <style>
    /* 确保没有水平导航栏显示 */
    .main-content > div:nth-child(2):has(.tabs) {
      display: none !important;
    }
    
    /* 为主题适配添加额外样式 */
    body.dark-theme .section,
    body.dark-theme .combination-table {
      background-color: #1a1a1a;
      color: #ffffff;
    }
    
    body.dark-theme .combination-table th,
    body.dark-theme .combination-table td {
      border-color: #333333;
    }
    
    body.dark-theme .highlight {
      background-color: rgba(223, 34, 32, 0.8) !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航栏 -->
      <div class="left-sidebar">
        <!-- 顶部快捷栏 -->
        <div class="top-bar">
          <div class="current-period">25120期</div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
          </ul>
        </nav>
        
        <!-- 期数选择区 -->
        <div class="period-selection">
          <h4 class="section-title">选择统计范</h4>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <select class="period-dropdown">
              <option selected>最新100期</option>
              <option>最新50期</option>
              <option>最新35期</option>
              <option>最新200期</option>
              <option>最新300期</option>
              <option>最新500期</option>
              <option>最新1000期</option>
              <option>最新1500期</option>
              <option>最新2000期</option>
              <option>全部期</option>
            </select>
            <input type="number" id="customPeriod" class="period-input" placeholder="输入期数" min="1" max="5000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.3s, box-shadow 0.3s;">
          </div>
        </div>
      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">倒数3期三球组合分析</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='index.html'">返回</button>
          </div>
        </div>
        
        <!-- 横向布局容器 -->
        <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px;">
          <!-- 开奖信息区域 -->
          <div class="section" style="flex: 1; min-width: 200px;">
            <div class="section-header" style="margin-bottom: 10px;">
              <h3 style="margin: 0;">最新开奖信息</h3>
            </div>
            <div class="draw-info-container" style="display: flex; justify-content: space-between;">
              <!-- 最新一期开奖信息 -->
              <div class="draw-info-box" id="latestDrawInfoBox">
                <!-- 标题已移除 -->
                <div id="latestDrawInfo">
                  <!-- 数据将通过JavaScript动态生成 -->
                  <div>加载中..</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 倒数2期开奖信息 -->
          <div class="section" style="flex: 1; min-width: 200px;">
            <div class="section-header" style="margin-bottom: 10px;">
              <h3 style="margin: 0;">倒数2期开奖信息</h3>
            </div>
            <div class="draw-info-container">
              <div class="draw-info-box" id="thirdLastDrawInfoBox">
                <!-- 标题已移除 -->
                <div id="thirdLastDrawInfo">
                  <!-- 数据将通过JavaScript动态生成 -->
                  <div>加载中..</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 前区推荐买号 -->
          <div class="section" style="flex: 1; min-width: 200px;">
            <div class="section-header" style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
              <h3 style="margin: 0;">前区推荐买号</h3>
              <button class="backtest-btn" onclick="goToFrontBuyBacktestPage()" style="padding: 4px 8px; font-size: 12px; background-color: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 12a10 10 0 0 1 20 0M2 12a10 10 0 0 0 20 0"/></svg></button>
            </div>
            <!-- 出现最多球 -->
            <div style="margin-top: 8px;">
              <span style="font-weight: bold;">出现最多球：</span>
              <div id="firstZoneMostOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
                <!-- 数据将通过JavaScript动态生成 -->
              </div>
            </div>
            <!-- 出现最少球 -->
            <div style="margin-top: 8px;">
              <span style="font-weight: bold;">出现最少球：</span>
              <div id="firstZoneLeastOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
                <!-- 数据将通过JavaScript动态生成 -->
              </div>
            </div>
            <!-- 出现平均球 -->
            <div style="margin-top: 8px;">
              <span style="font-weight: bold;">出现平均球：</span>
              <div id="firstZoneAverageOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
                <!-- 数据将通过JavaScript动态生成 -->
              </div>
            </div>
          </div>
          
          <!-- 前区推荐杀号 -->
          <div class="section" style="flex: 1; min-width: 200px;">
            <div class="section-header" style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
              <h3 style="margin: 0;">前区推荐杀号</h3>
              <div style="display: flex; gap: 10px; align-items: center;">
                <button class="copy-btn" onclick="copyKillNumbers('front')" style="padding: 4px 8px; font-size: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
                <a href="dao_shu_3_qi_san_qiu_sha_hao_hui_ce_xiang_qing.html" style="color: #1890ff; text-decoration: none;">查看回测结果</a>
              </div>
            </div>
            <div class="kill-numbers-container" id="firstZoneKillNumbersContainer">
              <div id="firstZoneRecommendations" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                <!-- 数据将通过JavaScript动态生成 -->
              </div>
              <div style="margin-top: 10px; text-align: center;">
                <a href="dao_shu_3_qi_san_qiu_sha_hao_hui_ce_xiang_qing.html" style="color: #1890ff; text-decoration: none;">查看回测结果</a>
              </div>
            </div>
          </div>
        </div>

        <!-- 前区三球组合统计 -->
        <div class="section">
          <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">前区三球组合统计</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
              <div style="color: #DF2220;">
                <!-- 统计信息将通过JavaScript动态生成 -->
              </div>
              <button class="btn back-btn" onclick="window.location.href='dao_shu_3_qi_san_qiu_sha_hao_hui_ce_xiang_qing.html'">查看回测结果</button>
            </div>
          </div>
          <div style="overflow-x: auto;">
            <table class="combination-table">
              <thead id="firstZoneTableHeader">
                <tr>
                  <th>组合号</th>
                  <th>出现次数</th>
                  <!-- 前区号码1-35将通过JavaScript动态生成 -->
                </tr>
              </thead>
              <tbody id="firstZoneCombinations">
                <!-- 数据将通过JavaScript动态生成 -->
                <tr>
                  <td colspan="37" style="text-align: center;">暂无三球组合统计数据</td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <!-- 前区汇总数据图表 -->
          <div class="chart-container" style="margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <h4>前区号码出现次数分布</h4>
              <div>
                <label style="margin-right: 10px;">图表排序：</label>
                <select id="firstZoneChartSort" style="padding: 5px;">
                  <option value="number">按号码顺序</option>
                  <option value="count_asc" selected>出现次数升序</option>
                  <option value="count_desc">出现次数降序</option>
                </select>
              </div>
            </div>
            <canvas id="firstZoneChart" width="800" height="300"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/dao_shu_3_qi_san_qiu_zu_he.js"></script>
</body>
</html>
