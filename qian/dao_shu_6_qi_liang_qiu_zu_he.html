  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
      // 确保调用最新开奖信息函数
      xuan_ran_zui_xin_kai_jiang();
      // 调用倒数第6期开奖信息函数
      xuan_ran_dao_shu_6_qi_kai_jiang();

  <script>
    // 从sql_zui_xin_yi_qi接口获取最新一期开奖信息
    async function huo_qu_sql_zui_xin_yi_qi() {
      try {
        // 调用d:\中啦\caishen4\hou\sql_zui_xin_yi_qi.js对应的接口
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        
        if (!response.ok) {
          console.error('接口请求失败，状态码:', response.status);
          return null;
        }
        
        const result = await response.json();
        console.log('sql_zui_xin_yi_qi接口返回数据:', result);
        
        // 确保正确处理后端返回的success和latestDraw结构
        if (result && result.success && result.latestDraw) {
          return result.latestDraw;
        } else {
          console.error('接口返回数据格式不正确:', result);
          return null;
        }
      } catch (error) {
        console.error('获取最新一期开奖数据失败:', error);
        return null;
      }
    }
    
    // 从sql_dao_shu_6_qi接口获取倒数第6期开奖信息
    async function huo_qu_sql_dao_shu_6_qi() {
      try {
        // 调用d:\中啦\caishen4\hou\sql_dao_shu_6_qi.js对应的接口
        const response = await fetch('http://localhost:18889/sql_dao_shu_6_qi');
        
        if (!response.ok) {
          console.error('接口请求失败，状态码:', response.status);
          return null;
        }
        
        const result = await response.json();
        console.log('sql_dao_shu_6_qi接口返回数据:', result);
        
        // 确保正确处理后端返回的success和sixthLastDraw结构
        if (result && result.success && result.sixthLastDraw) {
          return result.sixthLastDraw;
        } else {
          console.error('接口返回数据格式不正确:', result);
          return null;
        }
      } catch (error) {
        console.error('获取倒数第6期开奖数据失败:', error);
        return null;
      }
    }
    
    // 渲染最新一期开奖信息到新增的区域
    async function xuan_ran_sql_zui_xin_yi_qi() {
      const latestDraw = await huo_qu_sql_zui_xin_yi_qi();
      const latestDrawInfoElement = document.getElementById('latestDrawInfo');
      
      if (!latestDraw) {
        if (latestDrawInfoElement) {
          latestDrawInfoElement.innerHTML = '<div style="color: #DF2220; font-weight: bold;">接口失败</div>';
        }
        return;
      }
      
      // 处理日期格式，只显示年月日
      let formattedDate = latestDraw.drawDate;
      if (formattedDate && typeof formattedDate === 'string') {
        // 处理ISO格式日期
        if (formattedDate.includes('T')) {
          formattedDate = formattedDate.split('T')[0];
        } else if (formattedDate.includes(' ')) {
          formattedDate = formattedDate.split(' ')[0];
        }
      }
      
      // 更新顶部快捷栏的期数显示
      if (latestDraw.period && window.updateCurrentPeriod) {
        updateCurrentPeriod(latestDraw.period);
      }
      
      if (latestDrawInfoElement) {
        latestDrawInfoElement.innerHTML = `
          <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
            期号: ${latestDraw.period}
          </div>
          <div>
            开奖日期: ${formattedDate}
          </div>
          <div>
            前区号码: ${Array.isArray(latestDraw.firstZoneNumbers) ? latestDraw.firstZoneNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ') : ''}
          </div>
          <div>
            后区号码: ${Array.isArray(latestDraw.lastZoneNumbers) ? latestDraw.lastZoneNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ') : ''}
          </div>`;
      }
    }
    
    // 渲染倒数第6期开奖信息到新增的区域
    async function xuan_ran_sql_dao_shu_6_qi() {
      const sixthLastDraw = await huo_qu_sql_dao_shu_6_qi();
      const sixthLastDrawInfoElement = document.getElementById('secondLastDrawInfo');
      
      if (!sixthLastDraw) {
        if (sixthLastDrawInfoElement) {
          sixthLastDrawInfoElement.innerHTML = '<div>接口失败</div>';
        }
        return;
      }
      
      // 处理日期格式，只显示年月日
      let formattedDate = sixthLastDraw.drawDate;
      if (formattedDate && typeof formattedDate === 'string') {
        // 处理ISO格式日期
        if (formattedDate.includes('T')) {
          formattedDate = formattedDate.split('T')[0];
        } else if (formattedDate.includes(' ')) {
          formattedDate = formattedDate.split(' ')[0];
        }
      }
      
      if (sixthLastDrawInfoElement) {
        sixthLastDrawInfoElement.innerHTML = `
          <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
            期号: ${sixthLastDraw.period}
          </div>
          <div>
            开奖日期: ${formattedDate}
          </div>
          <div>
            前区号码: ${Array.isArray(sixthLastDraw.firstZoneNumbers) ? sixthLastDraw.firstZoneNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ') : ''}
          </div>
          <div>
            后区号码: ${Array.isArray(sixthLastDraw.lastZoneNumbers) ? sixthLastDraw.lastZoneNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ') : ''}
          </div>
        `;
      }
    }
    async function huo_qu_zui_xin_kai_jiang() {
      console.log('huo_qu_zui_xin_kai_jiang函数开始执行');
      try {
        console.log('准备调用/sql_zui_xin_yi_qi接口');
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        console.log('fetch调用成功，status:', response.status);
        
        if (!response.ok) {
          console.error('HTTP错误，状态码:', response.status);
          alert('接口失败');
        }
        
        const result = await response.json();
        console.log('获取到接口返回数据:', result);
        
        // 确保正确处理后端返回的success和latestDraw结构
        if (result && result.success && result.latestDraw) {
          console.log('数据格式正确，返回latestDraw:', result.latestDraw);
          return result.latestDraw;
        } else {
          console.error('接口返回数据格式不正确:', result);
          alert('获取开奖数据失败');
          return null;
        }

      // 按出现次数降序排序，次数相同时按球号升序
      sortedNumbers.sort((a, b) => {
        if (b.count !== a.count) {
          return b.count - a.count;
        }
        return a.number - b.number;
      });

    // 复制杀号到剪贴板
    function copyKillNumbers(zoneType) {
      let killNumbersText;
      let copyBtn;
      
      if (zoneType === 'front') {
        const frontKillNumbersElement = document.getElementById('front-kill-numbers');
        killNumbersText = frontKillNumbersElement.textContent.trim();
        copyBtn = frontKillNumbersElement.closest('div').querySelector('.copy-btn');
      } else {
        const backKillNumbersElement = document.getElementById('back-kill-numbers');
        killNumbersText = backKillNumbersElement.textContent.trim();
        copyBtn = backKillNumbersElement.closest('div').querySelector('.copy-btn');
      }
      
      if (!killNumbersText || killNumbersText === '--' || killNumbersText.includes('暂无推荐杀号')) {
        alert('暂无推荐杀号可复制');
        return;
      }
      
      // 提取数字
      const killNumbers = killNumbersText.match(/\d+/g);
      if (!killNumbers || killNumbers.length === 0) {
        alert('无法提取杀号数字');
        return;
      }
      
      // 复制到剪贴板
      const textToCopy = killNumbers.join(' ');
      
      navigator.clipboard.writeText(textToCopy).then(() => {
        // 显示复制成功反馈
        if (copyBtn) {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = '已复制';
          copyBtn.style.backgroundColor = '#2196F3';
          
          // 恢复原始状态
          setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.backgroundColor = '#4CAF50';
          }, 1500);
        }
      }).catch(err => {
        console.error('复制失败:', err);
        alert('复制失败，请手动复制');
      });
    }
    
    // 绘制前区汇总数据图表
    async function drawFrontZoneChart(totalCounts, periodValue) {
      const canvas = document.getElementById('firstZoneChart');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      const isDarkTheme = document.body.classList.contains('dark-theme');
      
      // 清空画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 设置图表样式
      const chartWidth = canvas.width;
      const chartHeight = canvas.height;
      const padding = { top: 20, right: 20, bottom: 40, left: 40 };
      const chartInnerWidth = chartWidth - padding.left - padding.right;
      const chartInnerHeight = chartHeight - padding.top - padding.bottom;
      
      // 准备数据
      const data = [];
      for (let i = 1; i <= 35; i++) {
        data.push({
          number: i,
          count: totalCounts[i] || 0
        });
      }
      
      // 获取排序方式
      const sortSelect = document.getElementById('firstZoneChartSort');
      const sortType = sortSelect ? sortSelect.value : 'number';
      
      // 根据选择的排序方式对数据进行排序
      switch (sortType) {
        case 'count_asc':
          // 按出现次数升序
          data.sort((a, b) => a.count - b.count);
          break;
        case 'count_desc':
          // 按出现次数降序
          data.sort((a, b) => b.count - a.count);
          break;
        case 'number':
        default:
          // 按号码顺序
          data.sort((a, b) => a.number - b.number);
          break;
      }
      
      // 计算排名：始终基于出现次数降序 (最多的为第 1 名)
      // 创建副本按出现次数降序排序，次数相同时按球号升序
      const sortedByCount = [...data].sort((a, b) => {
        if (b.count !== a.count) {
          return b.count - a.count;  // 出现次数降序
        }
        return a.number - b.number;  // 次数相同时，球号升序
      });
      // 计算排名 - 每个号码都有唯一排名
      const rankMap = {};
      for (let i = 0; i < sortedByCount.length; i++) {
        rankMap[sortedByCount[i].number] = i + 1;  // 直接使用索引 +1 作为排名
      }
      // 为原始数据添加排名
      data.forEach(item => {
        item.rank = rankMap[item.number];
      });
      
      // 计算最大值
      const maxCount = Math.max(...data.map(item => item.count), 1);
      
      // 绘制背景
      ctx.fillStyle = isDarkTheme ? '#222' : '#fff';
      ctx.fillRect(0, 0, chartWidth, chartHeight);
      
      // 绘制坐标轴
      ctx.strokeStyle = isDarkTheme ? '#666' : '#333';
      ctx.lineWidth = 1;
      
      // Y轴
      ctx.beginPath();
      ctx.moveTo(padding.left, padding.top);
      ctx.lineTo(padding.left, chartHeight - padding.bottom);
      ctx.stroke();
      
      // X轴
      ctx.beginPath();
      ctx.moveTo(padding.left, chartHeight - padding.bottom);
      ctx.lineTo(chartWidth - padding.right, chartHeight - padding.bottom);
      ctx.stroke();
      
      // 绘制Y轴刻度和标签
      const yAxisSteps = 5;
      ctx.fillStyle = isDarkTheme ? '#ccc' : '#333';
      ctx.font = '10px Arial';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      
      for (let i = 0; i <= yAxisSteps; i++) {
        const y = padding.top + (chartInnerHeight / yAxisSteps) * i;
        const count = Math.round(maxCount * (1 - i / yAxisSteps));
        
        // 绘制刻度线
        ctx.beginPath();
        ctx.moveTo(padding.left - 5, y);
        ctx.lineTo(padding.left, y);
        ctx.stroke();
        
        // 绘制标签
        ctx.fillText(count.toString(), padding.left - 10, y);
      }
      
      // 绘制 X 轴标签：根据排序方式决定显示排名序号
      // 升序时：从右到左 1,2,3... (最右边是 1)
      // 降序时：从左到右 1,2,3... (最左边是 1)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let i = 0; i < data.length; i++) {
        const x = padding.left + (chartInnerWidth / data.length) * (i + 0.5);
        const y = chartHeight - padding.bottom + 5;
        let positionNumber;
        if (sortType === 'count_asc') {
          // 升序：从右到左 1,2,3...
          positionNumber = data.length - i;
        } else {
          // 降序或按号码：从左到右 1,2,3...
          positionNumber = i + 1;
        }
        ctx.fillText(`${positionNumber}`, x, y);
      }
      
      // 绘制柱状图
      const barWidth = chartInnerWidth / data.length * 0.8;
      
      data.forEach((item, index) => {
        const barHeight = (item.count / maxCount) * chartInnerHeight;
        const x = padding.left + (chartInnerWidth / data.length) * index + (chartInnerWidth / data.length - barWidth) / 2;
        const y = chartHeight - padding.bottom - barHeight;
        
        // 颜色设置
        // 根据数值大小调整颜色深度
        const intensity = item.count / maxCount;
        ctx.fillStyle = `rgba(223, 34, 32, ${0.5 + intensity * 0.5})`;
        
        // 绘制柱子
        ctx.fillRect(x, y, barWidth, barHeight);
        
        // 绘制数值
        ctx.fillStyle = isDarkTheme ? '#fff' : '#333';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        if (item.count > 0) {
          ctx.fillText(item.count.toString(), x + barWidth / 2, y - 2);
        }
        
        // 绘制排名
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`${item.rank}`, x + barWidth / 2, chartHeight - padding.bottom - 2);
      });
      
      // 绘制统计期数信息
      ctx.fillStyle = isDarkTheme ? '#ccc' : '#333';
      ctx.font = '12px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      
      // 获取并显示具体期数
      let periodText;
      if (periodValue === 'all') {
        // 获取总期数
        const totalPeriods = await huo_qu_lottery_results_total();
        periodText = totalPeriods ? `${totalPeriods}期` : '全部期';
      } else {
        periodText = `最近${periodValue}期`;
      }
      
      // 计算总出现次数和平均次数
      const totalOccurrences = data.reduce((sum, item) => sum + item.count, 0);
      const averageCount = Math.round(totalOccurrences / 35); // 前区有35个号码
      
      ctx.fillText(`统计期数: ${periodText} | 平均次数: ${averageCount}`, padding.left + 5, padding.top + 15);
    }

    <!-- 核心功能：最新开奖信息展示 -->
    <script>
      // 确保DOM完全加载后再执行
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM已完全加载，开始初始化最新开奖信息功能');
        
        // 删除刷新按钮功能
        
        // 加载最新开奖信息
        function loadLatestDrawInfo() {
          console.log('开始加载最新开奖信息...');
          
          // 先更新UI显示加载中状态
          const infoBox = document.getElementById('latestDrawInfoBoxContent');
          if (infoBox) {
            infoBox.innerHTML = '<div style="color: #DF2220; font-weight: bold;">加载中...</div>';
          } else {
            console.error('未找到latestDrawInfoBoxContent元素');
          }
          
          // 使用简单的fetch调用，添加超时处理
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时
          
          fetch('http://localhost:18889/sql_zui_xin_yi_qi', {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json'
            },
            signal: controller.signal
          })
          .then(response => {
            clearTimeout(timeoutId);
            console.log('fetch响应状态:', response.status, '响应类型:', response.type);
            if (!response.ok) {
              throw new Error(`HTTP错误! 状态: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            console.log('成功获取开奖数据:', JSON.stringify(data));
            
            // 更新UI显示数据
            const infoBox = document.getElementById('latestDrawInfoBoxContent');
            if (infoBox) {
              if (data && data.success && data.latestDraw) {
                const draw = data.latestDraw;
                // 处理日期格式
                let formattedDate = draw.drawDate || '-';
                if (formattedDate && typeof formattedDate === 'string') {
                  if (formattedDate.includes('T')) {
                    formattedDate = formattedDate.split('T')[0];
                  } else if (formattedDate.includes(' ')) {
                    formattedDate = formattedDate.split(' ')[0];
                  }
                }
                
                infoBox.innerHTML = `
                <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
                  期号: ${draw.period}
                </div>
                <div>
                  开奖日期: ${formattedDate}
                </div>
                <div>
                  前区号码: ${Array.isArray(draw.firstZoneNumbers) ? draw.firstZoneNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ') : '-'}
                </div>
                <div>
                  后区号码: ${Array.isArray(draw.lastZoneNumbers) ? draw.lastZoneNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ') : '-'}
                </div>
                `;
              } else {
                infoBox.innerHTML = '<div style="color: #DF2220;">暂无开奖数据</div>';
                console.warn('返回的数据格式不正确或无数据:', data);
              }
            }
          })
          .catch(error => {
            clearTimeout(timeoutId);
            console.error('获取开奖信息失败:', error.name, error.message);
            
            // 更新UI显示错误信息
            const infoBox = document.getElementById('latestDrawInfoBoxContent');
            if (infoBox) {
              infoBox.innerHTML = '<div style="color: #DF2220;">接口失败</div>';
            }
            
            // 显示错误提示
            alert('接口失败: ' + (error.message || '未知错误'));
          });
        }
        
        // 延迟一秒后加载数据，确保页面元素都已渲染
        setTimeout(() => {
          console.log('延迟加载最新开奖信息...');
          loadLatestDrawInfo();
        }, 1000);
      });
    </script>
