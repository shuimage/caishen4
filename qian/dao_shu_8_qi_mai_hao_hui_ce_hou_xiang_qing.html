<body>

      <!-- 右侧主内容区 -->

          <h1 class="page-title">倒数8期两球组合后区买号回测结果</h1>

            <button class="btn back-btn" onclick="window.location.href='dao_shu_8_qi_liang_qiu_zu_he.html'">返回</button>

        <!-- 回测期数和统计期数下拉选项 -->

    <!-- 回测结果列表 -->

        <div style="overflow-x: auto;">

                <th>下下下下下下下下期实际开奖后区</th>
                <th>后区正确买号数</th>
                <th>后区错误买号数</th>
                <th>是否成功买号</th>
              </tr>
            </thead>
            <tbody id="backtestResults">
              <!-- 数据将通过JavaScript动态生成 -->

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 从URL参数中获取回测期数、统计期数和回测方法
    function getURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const backtestPeriod = urlParams.get('backtest_period') || '';
      const statsPeriod = urlParams.get('stats_period') || '';
      const backtestMethod = urlParams.get('backtest_method') || '';
      return { backtestPeriod, statsPeriod, backtestMethod };
    }
    
    // 从后端获取回测数据
    async function huo_qu_dao_shu_8_qi_hou_mai_hao_hui_ce(backtestPeriod = '100', statsPeriod = '100', backtestMethod = 'rank1') {
      try {
        const response = await fetch(`http://localhost:18889/huo_qu_dao_shu_8_qi_hou_mai_hao_hui_ce?backtest_period=${backtestPeriod}&stats_period=${statsPeriod}&backtest_method=${backtestMethod}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          return result.data;
        } else {
          alert('接口失败');
          return null;
        }
      } catch (error) {
        console.error('接口失败:', error);
        alert('接口失败');
        return null;
      }
    }
    
    // 获取全部期数
    async function getTotalPeriods() {
      try {
        const response = await fetch('http://localhost:18889/huo_qu_lottery_results_total');
        const result = await response.json();
        return result.success ? result.total : 1000;
      } catch (error) {
        console.error('获取全部期数失败:', error);
        return 1000; // 默认值
      }
    }
    
    // 测试单个统计期值的平均正确率
    async function testStatsPeriod(backtestPeriod, statsPeriod, backtestMethod) {
      try {
        const backtestData = await huo_qu_dao_shu_8_qi_hou_mai_hao_hui_ce(backtestPeriod, statsPeriod, backtestMethod);
        if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
          return { statsPeriod, accuracy: 100 };
        }
        
        let successBuyCount = 0;
        backtestData.backtestResults.forEach(result => {
          if (result.backCorrectBuy > 0) {
            successBuyCount++;
          }
        });
        
        const totalPeriods = backtestData.backtestResults.length;
        const averageCorrectRate = totalPeriods > 0 ? 
          ((successBuyCount / totalPeriods) * 100) : 100;
        
        return { statsPeriod, accuracy: averageCorrectRate };
      } catch (error) {
        console.error(`测试统计期${statsPeriod} 失败:`, error);
        return { statsPeriod, accuracy: 100 };
      }
    }
    
    // 平均率最低功能主函数
    function findLowestAccuracyStatsPeriod() {
      // 获取回测方法
      const backtestMethod = document.getElementById('backtestMethod').value;
      
      // 直接跳转到新页面，搜索逻辑在新页面中执行
      window.location.href = `dao_shu_8_qi_hou_ping_jun_lv_zui_di_detail.html?backtest_method=${backtestMethod}`;
    }
    
    // 平均率最高功能主函数
    function findHighestAccuracyStatsPeriod() {
      // 获取回测方法
      const backtestMethod = document.getElementById('backtestMethod').value;
      
      // 直接跳转到新页面，搜索逻辑在新页面中执行
      window.location.href = `dao_shu_8_qi_hou_ping_jun_lv_zui_gao_detail.html?backtest_method=${backtestMethod}`;
    }
    
    // 渲染回测数据
    function renderBacktestData(backtestData) {
      const backtestResults = document.getElementById('backtestResults');
      const backtestStats = document.getElementById('backtestStats');
      
      if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
        backtestResults.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 20px; color: #666;">暂无回测数据</td></tr>';
        backtestStats.textContent = '共回测0期，平均正确率：0%';
        return;
      }
      
      // 计算平均正确率（成功买号次数/总回测期数）
      let successBuyCount = 0;
      
      backtestData.backtestResults.forEach(result => {
        // 统计成功买号次数（后区正确买号数 > 0）
        if (result.backCorrectBuy > 0) {
          successBuyCount++;
        }
      });
      
      const totalPeriods = backtestData.backtestResults.length;
      const averageCorrectRate = totalPeriods > 0 ? 
        ((successBuyCount / totalPeriods) * 100).toFixed(3) : 0;
      
      // 更新统计信息
      backtestStats.textContent = `共回测${backtestData.backtestResults.length}期，平均正确率：${averageCorrectRate}%`;
      
      // 渲染回测列表
      backtestResults.innerHTML = '';
      
      backtestData.backtestResults.forEach((result, index) => {
        const tr = document.createElement('tr');
        
        // 格式化后区推荐买号，确保只显示一个球
        let backBuyNumbersStr = '';
        if (result.backBuyNumbers && (Array.isArray(result.backBuyNumbers) && result.backBuyNumbers.length > 0) || (typeof result.backBuyNumbers === 'string' && result.backBuyNumbers.trim() !== '')) {
          // 只显示第一个球
          if (Array.isArray(result.backBuyNumbers)) {
            backBuyNumbersStr = `<span class="blue-ball">${result.backBuyNumbers[0]}</span>`;
          } else if (typeof result.backBuyNumbers === 'string') {
            // 如果是字符串，直接显示
            backBuyNumbersStr = `<span class="blue-ball">${result.backBuyNumbers}</span>`;
          }
        } else {
          // 如果没有数据，显示默认值
          // 这里使用1作为默认值，确保始终显示一个球
          backBuyNumbersStr = '<span class="blue-ball">1</span>';
        }
        
        // 格式化下下下下下下下下期实际开奖后区
        const nextNextNextNextNextNextNextBackNumbersStr = result.nextNextNextNextNextNextNextBackNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ');
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${result.currentIssue}</td>
          <td>${backBuyNumbersStr}</td>
          <td>1</td>
          <td>${result.nextNextNextNextNextNextNextIssue}</td>
          <td>${nextNextNextNextNextNextNextBackNumbersStr}</td>
          <td style="color: green;">${result.backCorrectBuy}</td>
          <td style="color: red;">${result.backWrongBuy}</td>
          <td>
            ${result.backCorrectBuy > 0 ? 
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#4CAF50"/><path d="M7 12L10 15L17 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : 
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#F44336"/><path d="M8 8L16 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 8L8 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            }
          </td>
        `;
        
        backtestResults.appendChild(tr);
      });
    }
    
    // 获取并渲染回测数据
    async function fetchAndRenderBacktestData(backtestPeriod = '100', statsPeriod = '100', backtestMethod = 'rank1') {
      const backtestData = await huo_qu_dao_shu_8_qi_hou_mai_hao_hui_ce(backtestPeriod, statsPeriod, backtestMethod);
      renderBacktestData(backtestData);
    }
    
    // 保存回测期数、统计期数和回测方法到localStorage
    function savePeriodSelection(backtestPeriod, statsPeriod, backtestMethod) {
      try {
        localStorage.setItem('backtestPeriod', backtestPeriod);
        localStorage.setItem('statsPeriod', statsPeriod);
        // 保存用户选择的回测方法
        localStorage.setItem('backtestMethod', backtestMethod);
      } catch (e) {
        console.error('保存统计范围失败:', e);
      }
    }
    
    // 从localStorage读取保存的回测期数、统计期数和回测方法
    function getSavedPeriodSelection() {
      try {
        const backtestPeriod = localStorage.getItem('backtestPeriod') || '100';
        const statsPeriod = localStorage.getItem('statsPeriod') || '100';
        const backtestMethod = localStorage.getItem('backtestMethod') || 'rank1';
        return { backtestPeriod, statsPeriod, backtestMethod };
      } catch (e) {
        console.error('读取统计范围失败:', e);
        return { backtestPeriod: '100', statsPeriod: '100', backtestMethod: 'rank1' };
      }
    }
    
    // 页面加载完成后渲染数据
    window.addEventListener('load', async function() {
      // 首先从URL参数中获取回测期数、统计期数和回测方法
      const urlParams = getURLParameters();
      
      // 获取保存的回测期数、统计期数和回测方法
      const savedParams = getSavedPeriodSelection();
      
      // 使用URL参数优先于保存的参数，最后使用默认值
      const backtestPeriod = urlParams.backtestPeriod || savedParams.backtestPeriod || '50';
      let statsPeriod = urlParams.statsPeriod || savedParams.statsPeriod || '100';
      // 使用URL参数中的回测方法，优先于保存的参数，最后使用默认值
      const backtestMethod = urlParams.backtestMethod || savedParams.backtestMethod || 'rank1';
      
      // 获取下拉选项元素和输入框元素
      const backtestMethodSelect = document.getElementById('backtestMethod');
      const backtestPeriodSelect = document.getElementById('backtestPeriod');
      const statsPeriodSelect = document.getElementById('statsPeriod');
      const statsPeriodInput = document.getElementById('statsPeriodInput');
      
      // 设置下拉选项的初始值
      backtestMethodSelect.value = backtestMethod;
      backtestPeriodSelect.value = backtestPeriod;
      
      // 检查statsPeriod是否是自定义值（不在下拉选项中）
      const dropdownOptions = Array.from(statsPeriodSelect.options).map(opt => opt.value);
      if (!dropdownOptions.includes(statsPeriod) && statsPeriod !== 'all') {
        // 如果是自定义值，显示在输入框中
        statsPeriodInput.value = statsPeriod;
      } else {
        // 如果在下拉选项中，设置下拉框的值
        statsPeriodSelect.value = statsPeriod;
      }
      
      // 保存选择的回测期数、统计期数和回测方法到localStorage
      savePeriodSelection(backtestPeriod, statsPeriod, backtestMethod);
      
      // 使用回测期数、统计期数和回测方法获取回测数据
      fetchAndRenderBacktestData(backtestPeriod, statsPeriod, backtestMethod);
      
      // 为回测方法下拉选择框添加事件监听器
      backtestMethodSelect.addEventListener('change', function() {
        const newBacktestMethod = this.value;
        const currentBacktestPeriod = backtestPeriodSelect.value;
        const currentStatsPeriod = statsPeriodInput.value || statsPeriodSelect.value;
        // 保存选择的回测期数、统计期数和回测方法
        savePeriodSelection(currentBacktestPeriod, currentStatsPeriod, newBacktestMethod);
        // 根据选择的回测期数、统计期数和回测方法重新获取回测数据
        fetchAndRenderBacktestData(currentBacktestPeriod, currentStatsPeriod, newBacktestMethod);
      });
      
      // 为回测期数下拉选择框添加事件监听器
      backtestPeriodSelect.addEventListener('change', function() {
        const newBacktestPeriod = this.value;
        const currentStatsPeriod = statsPeriodInput.value || statsPeriodSelect.value;
        const currentBacktestMethod = backtestMethodSelect.value;
        // 保存选择的回测期数、统计期数和回测方法
        savePeriodSelection(newBacktestPeriod, currentStatsPeriod, currentBacktestMethod);
        // 根据选择的回测期数、统计期数和回测方法重新获取回测数据
        fetchAndRenderBacktestData(newBacktestPeriod, currentStatsPeriod, currentBacktestMethod);
      });
      
      // 为统计期数下拉选择框添加事件监听器
      statsPeriodSelect.addEventListener('change', function() {
        // 清空手动输入值
        statsPeriodInput.value = '';
        const newStatsPeriod = this.value;
        const currentBacktestPeriod = backtestPeriodSelect.value;
        const currentBacktestMethod = backtestMethodSelect.value;
        // 保存选择的回测期数、统计期数和回测方法
        savePeriodSelection(currentBacktestPeriod, newStatsPeriod, currentBacktestMethod);
        // 根据选择的回测期数、统计期数和回测方法重新获取回测数据
        fetchAndRenderBacktestData(currentBacktestPeriod, newStatsPeriod, currentBacktestMethod);
      });
      
      // 为统计期数手动输入框添加事件监听器
      statsPeriodInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          const inputValue = this.value.trim();
          if (inputValue && parseInt(inputValue) > 0) {
            // 清空下拉框的选择
            statsPeriodSelect.value = '';
            const newStatsPeriod = inputValue;
            const currentBacktestPeriod = backtestPeriodSelect.value;
            const currentBacktestMethod = backtestMethodSelect.value;
            // 保存选择的回测期数、统计期数和回测方法
            savePeriodSelection(currentBacktestPeriod, newStatsPeriod, currentBacktestMethod);
            // 根据选择的回测期数、统计期数和回测方法重新获取回测数据
            fetchAndRenderBacktestData(currentBacktestPeriod, newStatsPeriod, currentBacktestMethod);
          }
        }
      });
      
      // 为统计期数手动输入框添加失去焦点事件监听器
      statsPeriodInput.addEventListener('blur', function() {
        const inputValue = this.value.trim();
        if (inputValue && parseInt(inputValue) > 0) {
          // 清空下拉框的选择
          statsPeriodSelect.value = '';
          const newStatsPeriod = inputValue;
          const currentBacktestPeriod = backtestPeriodSelect.value;
          const currentBacktestMethod = backtestMethodSelect.value;
          // 保存选择的回测期数、统计期数和回测方法
          savePeriodSelection(currentBacktestPeriod, newStatsPeriod, currentBacktestMethod);
          // 根据选择的回测期数、统计期数和回测方法重新获取回测数据
          fetchAndRenderBacktestData(currentBacktestPeriod, newStatsPeriod, currentBacktestMethod);
        } else if (!inputValue) {
          // 如果输入框为空，恢复使用下拉框的值
          const dropdownValue = statsPeriodSelect.value || '100';
          const currentBacktestPeriod = backtestPeriodSelect.value;
          const currentBacktestMethod = backtestMethodSelect.value;
          savePeriodSelection(currentBacktestPeriod, dropdownValue, currentBacktestMethod);
          fetchAndRenderBacktestData(currentBacktestPeriod, dropdownValue, currentBacktestMethod);
        }
      });
      
      // 为平均率最低按钮添加事件监听器
      document.getElementById('findLowestAccuracyBtn').addEventListener('click', findLowestAccuracyStatsPeriod);
      // 为平均率最高按钮添加事件监听器
      document.getElementById('findHighestAccuracyBtn').addEventListener('click', findHighestAccuracyStatsPeriod);
    });
    
    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事件
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状态
        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前导航项的活动状态
        this.classList.add('active');
        
        // 获取当前点击项的文本内容
        const navText = this.textContent.trim();
