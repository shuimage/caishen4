<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒数8期两球组合平均率最高统计期详情</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/navigation.js"></script>
  <script src="js/theme-toggle.js"></script>
  <style>
    .period-input {
      width: 80px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }
    .period-input::-webkit-inner-spin-button,
    .period-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    body.dark-theme .period-input {
      background-color: #2d2d2d;
      border-color: #444;
      color: #fff;
    }
    body.dark-theme .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
    }
    /* 详细信息列表样式 */
    .detail-list {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .detail-list th,
    .detail-list td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .detail-list th {
      background-color: #f8f9fa;
      font-weight: bold;
    }
    body.dark-theme .detail-list th {
      background-color: #2d2d2d;
      color: #fff;
    }
    body.dark-theme .detail-list td {
      background-color: #1a1a1a;
      color: #fff;
      border-bottom-color: #444;
    }
    /* 进度显示的深色主题样式- 增强选择器 */
    body.dark-theme #progress {
      background-color: #222222 !important;
      color: #ffffff !important;
      border-left-color: #ffffff !important;
      border: 1px solid #ffffff !important;
    }
    
    /* 进度条标题的深色主题样式 */
    body.dark-theme #progress strong {
      color: #ffffff !important;
    }
    
    /* 进度条背景的深色主题样式 - 使用更精确的选择器 */
    body.dark-theme #progress > div:nth-child(2) > div:first-child {
      background-color: #222222 !important;
      border: 1px solid #ffffff !important;
    }
    
    /* 进度文本容器的深色主题样式 */
    body.dark-theme #progress > div:nth-child(2) > div:last-child {
      color: #ffffff !important;
    }
    
    /* 进度条填充的深色主题样式 */
    body.dark-theme #progressBar {
      background-color: #4CAF50 !important;
    }
    
    /* 所有进度文本的深色主题样式 */
    body.dark-theme #progress #progressText,
    body.dark-theme #progress #progressPercentage,
    body.dark-theme #progress #currentPhase {
      color: #ffffff !important;
    }
    .red-ball {
      display: inline-block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      background-color: #DF2220;
      color: white;
      border-radius: 50%;
      margin: 0 2px;
      font-size: 12px;
    }
    .blue-ball {
      display: inline-block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      background-color: #2154F0;
      color: white;
      border-radius: 50%;
      margin: 0 2px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航栏 -->
      <div class="left-sidebar">
        <!-- 顶部快捷栏 -->
        <div class="top-bar">
          <div class="current-period">25120期</div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
          </ul>
        </nav>
      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">倒数8期两球组合平均率最高统计期详情</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.history.back()">返回</button>
          </div>
        </div>
    
        <!-- 最新1期开奖信息 -->
        <div class="section" id="latestDrawInfoSection">
          <div class="section-header" style="margin-bottom: 10px;">
            <h3 style="margin: 0;">最新1期开奖信息</h3>
          </div>
          <div id="latestDrawInfo" style="display: grid; grid-template-columns: 1fr; gap: 10px; align-items: center;">
            <!-- 数据将通过JavaScript动态生成 -->
            <div>加载中...</div>
          </div>
        </div>
    
        <!-- 回测结果列表 -->
        <div class="section">
          <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">倒数8期两球组合平均率最高统计期详情</h3>
            <div style="display: flex; gap: 10px;">
              <button class="btn" id="startBacktestBtn" style="background-color: #4CAF50; color: white;">开始回测</button>
              <button class="btn" id="stopBacktestBtn" style="background-color: #f44336; color: white; display: none;">终止回测</button>
            </div>
          </div>
          <!-- 进度显示 -->
          <div id="progress" style="display: none; margin-bottom: 15px; padding: 10px; background-color: #f8f9fa; border-left: 4px solid #007bff; border-radius: 4px;">
            <strong>回测进度：</strong>
            <span id="progressText">准备开始...</span><br>
            <div style="margin-top: 8px;">
              <div style="width: 100%; background-color: #e9ecef; border-radius: 4px; overflow: hidden;">
                <div id="progressBar" style="height: 8px; background-color: #007bff; width: 0%; transition: width 0.3s ease;"></div>
              </div>
              <div style="margin-top: 4px; font-size: 12px; color: #6c757d;">
                <span id="progressPercentage">0%</span> | 
                <span id="currentPhase">正在准备...</span>
              </div>
            </div>
          </div>
          <div style="overflow-x: auto;">
            <table class="detail-list">
              <thead>
                <tr>
                  <th>回测方法</th>
                  <th>回测期数</th>
                  <th>统计期数</th>
                  <th>平均正确率</th>
                  <th>当前期号</th>
                  <th>下下下下下下下下期前区推荐买号</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="detailResults">
                <!-- 数据将通过JavaScript动态生成 -->
                <tr>
                  <td colspan="7" style="text-align: center; padding: 20px; color: #666;">点击开始回测按钮开始执行回测</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });

    // 从URL参数中获取回测方法
    function getURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const backtestMethod = urlParams.get('backtest_method') || 'most';
      return { backtestMethod };
    }

    // 获取全部期数
    async function getTotalPeriods() {
      try {
        const response = await fetch('http://localhost:18889/huo_qu_lottery_results_total');
        const result = await response.json();
        return result.success ? result.total : 1000;
      } catch (error) {
        console.error('获取全部期数失败:', error);
        return 1000; // 默认值
      }
    }

    // 从后端获取回测数据 - 使用dao_shu_8_qi_mai_hao_hui_ce_xiang_qing.html的算法
    async function huo_qu_dao_shu_8_qi_mai_hao_hui_ce(backtestPeriod = '50', statsPeriod = '100', backtestMethod = 'most') {
      try {
        const response = await fetch(`http://localhost:18889/dao_shu_8_qi_mai_hao_hui_ce?backtest_period=${backtestPeriod}&stats_period=${statsPeriod}&backtest_method=${backtestMethod}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          return result.data;
        } else {
          alert('接口失败');
          return null;
        }
      } catch (error) {
        console.error('接口失败:', error);
        alert('接口失败');
        return null;
      }
    }

    // 测试单个统计期值的平均正确率 - 使用dao_shu_8_qi_mai_hao_hui_ce_xiang_qing.html的算法
    async function testStatsPeriod(backtestPeriod, statsPeriod, backtestMethod) {
      try {
        const backtestData = await huo_qu_dao_shu_8_qi_mai_hao_hui_ce(backtestPeriod, statsPeriod, backtestMethod);
        if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
          return { statsPeriod, accuracy: 100 };
        }
        
        let successBuyCount = 0;
        backtestData.backtestResults.forEach(result => {
          if (result.frontCorrectBuy > 0) {
            successBuyCount++;
          }
        });
        
        const totalPeriods = backtestData.backtestResults.length;
        const averageCorrectRate = totalPeriods > 0 ? 
          ((successBuyCount / totalPeriods) * 100) : 100;
        
        return { statsPeriod, accuracy: averageCorrectRate };
      } catch (error) {
        console.error(`测试统计期${statsPeriod} 失败:`, error);
        return { statsPeriod, accuracy: 100 };
      }
    }

    // 获取最新一期的期号
    async function getLatestPeriod() {
      try {
        // 调用sql_zui_xin_yi_qi接口获取最新一期开奖信息
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        const result = await response.json();
        if (result.success && result.data && result.data.length > 0) {
          const latestPeriod = result.data[0].period || result.data[0].issue;
          const latestPeriodNum = parseInt(latestPeriod);
          return (latestPeriodNum + 8) + '期'; // 下下下下下下下下期
        }
        return '最新期';
      } catch (error) {
        console.error('获取最新期号失败', error);
        return '最新期';
      }
    }
    
    // 获取最新1期开奖信息
    async function huo_qu_zui_xin_yi_qi_kai_jiang() {
      try {
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          // 格式化返回数据，使其与前端预期格式一致
          if (result.latestDraw) {
            return [{
              issue: result.latestDraw.period,
              draw_date: result.latestDraw.drawDate,
              red: result.latestDraw.firstZoneNumbers,
              blue: result.latestDraw.lastZoneNumbers
            }];
          }
          return [];
        } else {
          alert('接口失败');
          return null;
        }
      } catch (error) {
        console.error('获取最新1期开奖信息失败', error);
        alert('接口失败');
        return null;
      }
    }
    
    // 复制到剪贴板的功能
    async function copyToClipboard(numbers) {
      try {
        const tabSeparatedNumbers = numbers.join('\t');
        await navigator.clipboard.writeText(tabSeparatedNumbers);
        alert('复制成功，可直接粘贴到Excel');
      } catch (err) {
        console.error('复制失败:', err);
        alert('复制失败，请重试');
      }
    }

    // 渲染最新开奖信息
    async function renderLatestDrawInfo() {
      const latestDrawInfo = document.getElementById('latestDrawInfo');
      
      try {
        // 获取最新1期开奖信息
        const latestDraws = await huo_qu_zui_xin_yi_qi_kai_jiang();
        
        if (!latestDraws || latestDraws.length === 0) {
          latestDrawInfo.innerHTML = '<div style="color: #ff0000;">获取最新1期开奖信息失败</div>';
          return;
        }
        
        const draw = latestDraws[0];
        // 处理日期格式，只显示年月日
        let formattedDate = draw.drawDate || draw.draw_date;
        if (formattedDate && typeof formattedDate === 'string') {
          // 处理ISO格式日期（如：2025-10-28T16:00:00.000Z）
          if (formattedDate.includes('T')) {
            formattedDate = formattedDate.split('T')[0];
          }
          // 处理包含空格的日期（如：2025-10-28 16:00:00）
          else if (formattedDate.includes(' ')) {
            formattedDate = formattedDate.split(' ')[0];
          }
        }
        
        // 格式化前区和后区号码
        const frontNumbers = Array.isArray(draw.red) ? draw.red : [];
        const backNumbers = Array.isArray(draw.blue) ? draw.blue : [];
        
        latestDrawInfo.innerHTML = `
          <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
            期号: ${draw.period || draw.issue}
          </div>
          <div>
            开奖日期: ${formattedDate}
          </div>
          <div>
            前区号码: ${frontNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ')}
          </div>
          <div>
            后区号码: ${backNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ')}
          </div>
        `;
        
      } catch (error) {
        console.error('渲染最新1期开奖信息失败', error);
        latestDrawInfo.innerHTML = '<div style="color: #ff0000;">渲染最新1期开奖信息失败</div>';
      }
    }

    // 渲染详情数据
    async function renderDetailData(allResults, nextPeriod) {
      const detailResults = document.getElementById('detailResults');
      
      try {
        // 清空当前内容
        detailResults.innerHTML = '';
        
        // 如果没有结果，显示提示
        if (allResults.length === 0) {
          detailResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #666;">未找到平均率最高的统计期</td></tr>';
          return;
        }
        
        // 按平均正确率降序排序
        allResults.sort((a, b) => b.accuracy - a.accuracy);
        
        // 遍历所有结果
        for (const result of allResults) {
          const { statsPeriod, accuracy, backtestMethod, frontBuyNumbers } = result;
          
          // 平均正确率已经在搜索阶段计算好
          const averageCorrectRate = accuracy.toFixed(3);
          
          // 获取回测方法中文名称
          let backtestMethodText = '出现最多';
          if (backtestMethod === 'least') {
            backtestMethodText = '出现最少';
          } else if (backtestMethod === 'average') {
            backtestMethodText = '出现平均';
          } else if (backtestMethod.startsWith('rank')) {
            const rankMatch = backtestMethod.match(/^rank(\d+)$/);
            if (rankMatch) {
              backtestMethodText = `排名第${rankMatch[1]}`;
            }
          }
          
          // 格式化前区推荐买号
          const frontBuyNumbersStr = frontBuyNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
          
          // 创建表格行
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${backtestMethodText}</td>
            <td>50期</td>
            <td>${statsPeriod}期</td>
            <td>${averageCorrectRate}%</td>
            <td>${nextPeriod}</td>
            <td>${frontBuyNumbersStr}</td>
            <td>
              <button class="btn copy-btn" style="background-color: #4CAF50; color: white; padding: 5px 10px; font-size: 12px;">复制</button>
            </td>
          `;
          
          // 添加复制按钮事件
          const copyBtn = tr.querySelector('.copy-btn');
          copyBtn.addEventListener('click', () => copyToClipboard(frontBuyNumbers));
          
          detailResults.appendChild(tr);
        }
      } catch (error) {
        console.error('渲染详情数据失败:', error);
        detailResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #ff0000;">加载失败，请重试</td></tr>';
      }
    }

    // 获取最后一期期号
    async function getLastPeriod() {
      try {
        // 调用sql_dao_shu_8_qi接口获取倒数第8期开奖信息
        const response = await fetch('http://localhost:18889/sql_dao_shu_8_qi');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        if (result.success && result.eighthLastDraw) {
          // 获取倒数第8期期号，去掉"期"字
          const lastPeriod = result.eighthLastDraw.period;
          return lastPeriod.replace('期', '');
        }
        return '25120';
      } catch (error) {
        console.error('获取最后一期期号失败', error);
        return '25120';
      }
    }

    // 获取前区推荐买号 - 使用与dao_shu_8_qi_mai_hao_qian_qu_hui_ce_xiang_qing.html相同的算法
    async function huo_qu_qian_qu_tui_jian_mai_hao(statsPeriod, backtestMethod) {
      try {
        // 调用huo_qu_dao_shu_8_qi_mai_hao_hui_ce接口获取前区推荐买号
        const response = await fetch(`http://localhost:18889/dao_shu_8_qi_mai_hao_hui_ce?backtest_period=1&stats_period=${statsPeriod}&backtest_method=${backtestMethod}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        if (result.success && result.data && result.data.backtestResults && result.data.backtestResults.length > 0) {
          // 获取第一个回测结果的前区推荐买号
          return result.data.backtestResults[0].frontBuyNumbers || [];
        } else {
          alert('接口失败');
          return [];
        }
      } catch (error) {
        console.error('获取前区推荐买号失败:', error);
        return [];
      }
    }

    // 执行搜索并显示进度
    async function performSearch() {
      const progressDiv = document.getElementById('progress');
      const progressText = document.getElementById('progressText');
      const progressBar = document.getElementById('progressBar');
      const progressPercentage = document.getElementById('progressPercentage');
      const currentPhase = document.getElementById('currentPhase');
      const detailResults = document.getElementById('detailResults');
      const startBacktestBtn = document.getElementById('startBacktestBtn');
      const stopBacktestBtn = document.getElementById('stopBacktestBtn');
      
      // 进度计算变量
      let totalProgress = 0;
      let currentStep = 0;
      let totalSteps = 0;
      
      // 终止标志
      let isBacktestStopped = false;
      
      // 更新进度的函数
      function updateProgress(text, percentage, phase) {
        return new Promise(resolve => {
          // 减少DOM更新频率，只在百分比变化较大时更新
          const roundedPercentage = Math.round(percentage);
          const currentRoundedPercentage = Math.round(parseFloat(progressBar.style.width || '0%'));
          
          if (Math.abs(roundedPercentage - currentRoundedPercentage) >= 5 || roundedPercentage === 100) {
            // 直接更新DOM，不依赖requestAnimationFrame
            progressText.textContent = text;
            progressBar.style.width = `${percentage}%`;
            progressPercentage.textContent = `${roundedPercentage}%`;
            currentPhase.textContent = phase;
          }
          resolve();
        });
      }
      
      try {
        // 显示终止回测按钮，隐藏开始回测按钮
        startBacktestBtn.style.display = 'none';
        stopBacktestBtn.style.display = 'inline-block';
        
        // 立即显示进度条，直接更新DOM
        await new Promise(resolve => {
          progressDiv.style.display = 'block';
          progressText.textContent = '开始搜索平均率最高的统计期..';
          progressBar.style.width = '0%';
          progressPercentage.textContent = '0%';
          currentPhase.textContent = '正在准备...';
          detailResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #666;">正在搜索平均率最高的统计期..</td></tr>';
          resolve();
        });
        
        // 重置终止标志
        isBacktestStopped = false;
        
        // 添加终止回测按钮点击事件
        stopBacktestBtn.onclick = function() {
          isBacktestStopped = true;
          updateProgress('回测已终止', 100, '回测终止');
        };
        
        const backtestPeriod = '50'; // 固定回测期数为50期
        
        // 更新进度
        await updateProgress('正在获取总期数..', 5, '获取总期数');
        
        const totalPeriods = await getTotalPeriods();
        
        // 多阶段搜索策略，从大到小变化步长
        const searchStages = [
          { step: 200, expansion: 400 }, // 第一阶段：步长200，扩展范围400
          { step: 100, expansion: 200 }, // 第二阶段：步长100，扩展范围200
          { step: 50, expansion: 100 }    // 第三阶段：步长50，扩展范围100
        ];
        
        // 回测方法列表，只包括排名方法（前区有35个号码，排名最多到35）
        const backtestMethods = Array.from({length: 35}, (_, i) => `rank${i + 1}`);
        const allResults = [];
        
        // 计算总工作量
        totalSteps = backtestMethods.length * searchStages.length + 3; // 3个初始化和收尾步骤
        
        // 更新进度
        await updateProgress('正在获取最新一期期号..', 10, '获取最新期号');
        currentStep++;
        
        // 获取最后一期期号
        const lastPeriod = await getLastPeriod();
        const nextPeriod = (parseInt(lastPeriod) + 8) + '期'; // 下下下下下下下下期
        
        // 遍历三种回测方法
        for (const backtestMethod of backtestMethods) {
          let methodName;
          if (backtestMethod.startsWith('rank')) {
            const rankMatch = backtestMethod.match(/^rank(\d+)$/);
            methodName = rankMatch ? `排名第${rankMatch[1]}` : backtestMethod;
          } else {
            methodName = backtestMethod;
          }
          
          // 更新进度
          await updateProgress(`正在搜索回测方法: ${methodName}...`, 15 + (currentStep / totalSteps) * 60, `搜索回测方法: ${methodName}`);
          currentStep++;
          
          // 所有回测方法都从2000期开始
          let currentStart = 2000;
          let currentEnd = totalPeriods;
          let allTestResults = [];
          
          // 执行每个阶段的搜索
          for (let stageIndex = 0; stageIndex < searchStages.length; stageIndex++) {
            const stage = searchStages[stageIndex];
            const { step, expansion } = stage;
            
            // 更新进度
            const stageProgress = 15 + (currentStep / totalSteps) * 60;
            await updateProgress(
              `正在进行${methodName}方法的第${stageIndex + 1}阶段搜索（步长：${step}期）..`, 
              stageProgress, 
              `阶段${stageIndex + 1}，步长${step}`
            );
            currentStep++;
            
            let stageResults = [];
            
            // 计算当前阶段的期数范围和总次数
            const stageTotal = Math.ceil((currentEnd - currentStart) / step) + 1;
            
            // 生成所有需要测试的期数
            const testPeriods = [];
            for (let i = currentStart; i <= currentEnd; i += step) {
              testPeriods.push(i);
            }
            
            // 检查是否需要终止回测
            if (isBacktestStopped) {
              continue;
            }
            
            // 实时更新进度
            await updateProgress(
              `正在并行测试${testPeriods.length}个统计期..`, 
              15 + ((currentStep - 1) / totalSteps) * 60, 
              `并行测试 ${testPeriods.length} 个期数`
            );
            
            // 并行测试所有统计期
            const promises = testPeriods.map(period => testStatsPeriod(backtestPeriod, period, backtestMethod));
            const results = await Promise.all(promises);
            
            // 检查是否需要终止回测
            if (isBacktestStopped) {
              continue;
            }
            
            // 添加测试结果
            stageResults.push(...results);
            allTestResults.push(...results);
            
            // 检查是否需要终止回测
            if (isBacktestStopped) {
              break;
            }
            
            // 如果当前阶段没有结果，继续下一阶段
            if (stageResults.length === 0) {
              continue;
            }
            
            // 找出当前阶段的最高正确率
            const highestAccuracy = Math.max(...stageResults.map(result => result.accuracy));
            
            // 找出当前阶段中所有最高正确率的结果
            const highestResultsInStage = stageResults.filter(result => result.accuracy === highestAccuracy);
            
            // 计算下一阶段的搜索范围
            const minStatsPeriod = Math.min(...highestResultsInStage.map(result => result.statsPeriod));
            const maxStatsPeriod = Math.max(...highestResultsInStage.map(result => result.statsPeriod));
            
            // 扩展搜索范围，确保不遗漏相邻区域，且统计期数始终从2000期开始
            currentStart = Math.max(2000, minStatsPeriod - expansion);
            currentEnd = Math.min(totalPeriods, maxStatsPeriod + expansion);
          }
          
          // 从所有测试结果中找出最高正确率
          const highestAccuracy = Math.max(...allTestResults.map(result => result.accuracy));
          
          // 找出所有正确率等于最高值的期数
          const highestPeriods = allTestResults.filter(result => result.accuracy === highestAccuracy);
          
          // 对期数进行去重处理
          const uniquePeriodsMap = new Map();
          highestPeriods.forEach(result => {
            if (!uniquePeriodsMap.has(result.statsPeriod)) {
              uniquePeriodsMap.set(result.statsPeriod, result);
            }
          });
          
          // 将去重后的结果转换回数组，并添加回测方法信息
          const uniqueHighestPeriods = Array.from(uniquePeriodsMap.values()).map(result => ({
            ...result,
            backtestMethod
          }));
          
          // 添加到所有结果中
          allResults.push(...uniqueHighestPeriods);
        }
        
        // 更新进度
        await updateProgress('搜索完成，正在获取前区推荐买号..', 85, '获取前区推荐买号');
        currentStep++;
        
        // 为每个结果获取前区推荐买号
        for (let i = 0; i < allResults.length; i++) {
          // 检查是否需要终止回测
          if (isBacktestStopped) {
            break;
          }
          
          const result = allResults[i];
          let methodName;
          if (result.backtestMethod === 'most') {
            methodName = '出现最多';
          } else if (result.backtestMethod === 'least') {
            methodName = '出现最少';
          } else if (result.backtestMethod === 'average') {
            methodName = '出现平均';
          } else if (result.backtestMethod.startsWith('rank')) {
            const rankMatch = result.backtestMethod.match(/^rank(\d+)$/);
            methodName = rankMatch ? `排名第${rankMatch[1]}` : result.backtestMethod;
          } else {
            methodName = result.backtestMethod;
          }
          
          // 更新进度
          const buyProgress = 85 + ((i + 1) / allResults.length) * 10;
          await updateProgress(
            `正在获取统计期${result.statsPeriod}期，${methodName}方法的前区推荐买号..`, 
            buyProgress, 
            `处理结果 ${i + 1}/${allResults.length}`
          );
          
          result.frontBuyNumbers = await huo_qu_qian_qu_tui_jian_mai_hao(result.statsPeriod, result.backtestMethod);
        }
        
        // 过滤结果：过滤空推荐号码并实现去重
        const filteredResults = [];
        const seenResults = new Set();
        
        for (const result of allResults) {
          // 如果是排名方法且没有找到对应排名的号码（返回空数组），则跳过该结果
          if (result.backtestMethod.match(/^rank(\d+)$/) && result.frontBuyNumbers.length === 0) {
            continue;
          }
          
          // 去重：使用回测方法和统计期数的组合作为唯一标识
          const resultKey = `${result.backtestMethod}-${result.statsPeriod}`;
          if (!seenResults.has(resultKey)) {
            seenResults.add(resultKey);
            filteredResults.push(result);
          }
        }
        
        // 使用过滤后的结果
        allResults.length = 0;
        allResults.push(...filteredResults);
        
        // 检查是否需要终止回测
        if (isBacktestStopped) {
          detailResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #ff0000;">回测已终止</td></tr>';
        } else {
          // 更新进度
          await updateProgress(`找到 ${allResults.length} 个平均率最高的统计期，正在渲染结果...`, 98, '渲染结果');
          currentStep++;
          
          // 渲染详情数据，传递所有结果和下一期期号
          await renderDetailData(allResults, nextPeriod);
          
          // 更新进度
          await updateProgress('搜索完成，正在隐藏进度条...', 100, '完成');
        }
        
        // 隐藏进度
        await new Promise(resolve => {
          setTimeout(() => {
            progressDiv.style.display = 'none';
            resolve();
          }, 500);
        });
        
      } catch (error) {
        console.error('搜索最低正确率统计期失败', error);
        
        // 更新进度
        await updateProgress('搜索失败，请重试', 100, '搜索失败');
        detailResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #ff0000;">搜索失败，请重试</td></tr>';
      } finally {
        // 恢复按钮状态
        startBacktestBtn.style.display = 'inline-block';
        stopBacktestBtn.style.display = 'none';
        // 重置终止标志
        isBacktestStopped = false;
      }
    }

    // 页面加载完成后渲染最新开奖信息，回测功能需手动点击开始
    window.addEventListener('load', function() {
      renderLatestDrawInfo();
      
      // 添加开始回测按钮点击事件
      const startBacktestBtn = document.getElementById('startBacktestBtn');
      startBacktestBtn.addEventListener('click', performSearch);
    });
  </script>
