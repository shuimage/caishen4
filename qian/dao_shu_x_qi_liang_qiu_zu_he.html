  <script>
    // 全局变量
    let currentXPeriod = 5;
    let periodValue = '100';
    
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
      
      // 初始化X期数
      const xPeriodInput = document.getElementById('xPeriod');
      if (xPeriodInput) {
        currentXPeriod = parseInt(xPeriodInput.value) || 5;
      }
      
      // 确保调用最新开奖信息函数
      xuan_ran_zui_xin_kai_jiang();
      // 调用倒数第X期开奖信息函数
      xuan_ran_dao_shu_x_qi_kai_jiang();
      
      // 初始化数据
      renderFirstZoneAnalysisData();
      renderSecondZoneAnalysisData();
    });
    
    // 更新X期数
    function updateXPeriod() {
      const xPeriodInput = document.getElementById('xPeriod');
      const newXPeriod = parseInt(xPeriodInput.value);
      
      if (newXPeriod >= 1 && newXPeriod <= 20) {
        currentXPeriod = newXPeriod;
        // 重新加载数据
        xuan_ran_dao_shu_x_qi_kai_jiang();
        renderFirstZoneAnalysisData();
        renderSecondZoneAnalysisData();
      } else {
        alert('请输入1-20之间的期数');
      }
    }
  </script>
  <script>
    // 从sql_zui_xin_yi_qi接口获取最新一期开奖信息
    async function huo_qu_sql_zui_xin_yi_qi() {
      try {
        // 调用d:\中啦\caishen4\hou\sql_zui_xin_yi_qi.js对应的接口
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        
        if (!response.ok) {
          console.error('接口请求失败，状态码:', response.status);
          return null;
        }
        
        const result = await response.json();
        console.log('sql_zui_xin_yi_qi接口返回数据:', result);
        
        // 确保正确处理后端返回的success和latestDraw结构
        if (result && result.success && result.latestDraw) {
          return result.latestDraw;
        } else {
          console.error('接口返回数据格式不正确:', result);
          return null;
        }
      } catch (error) {
        console.error('获取最新一期开奖数据失败:', error);
        return null;
      }
    }
    
    // 从sql_dao_shu_x_qi接口获取倒数第X期开奖信息
    async function huo_qu_sql_dao_shu_x_qi() {
      try {
        // 调用d:\中啦\caishen4\hou\sql_dao_shu_x_qi.js对应的接口
        const response = await fetch(`http://localhost:18889/sql_dao_shu_x_qi?period=${currentXPeriod}`);
        
        if (!response.ok) {
          console.error('接口请求失败，状态码:', response.status);
          return null;
        }
        
        const result = await response.json();
        console.log('sql_dao_shu_x_qi接口返回数据:', result);
        
        // 确保正确处理后端返回的success和xLastDraw结构
        if (result && result.success && result.xLastDraw) {
          return result.xLastDraw;
        } else {
          console.error('接口返回数据格式不正确:', result);
          return null;
        }
      } catch (error) {
        console.error('获取倒数第X期开奖数据失败:', error);
        return null;
      }
    }
    
    // 渲染最新一期开奖信息到新增的区域
    async function xuan_ran_sql_zui_xin_yi_qi() {
      const latestDraw = await huo_qu_sql_zui_xin_yi_qi();
      const latestDrawInfoElement = document.getElementById('latestDrawInfo');
      
      if (!latestDraw) {
        if (latestDrawInfoElement) {
          latestDrawInfoElement.innerHTML = '<div style="color: #DF2220; font-weight: bold;">接口失败</div>';
        }
        return;
      }
      
      // 处理日期格式，只显示年月日
      let formattedDate = latestDraw.drawDate;
      if (formattedDate && typeof formattedDate === 'string') {
        // 处理ISO格式日期
        if (formattedDate.includes('T')) {
          formattedDate = formattedDate.split('T')[0];
        } else if (formattedDate.includes(' ')) {
          formattedDate = formattedDate.split(' ')[0];
        }
      }
      
      // 更新顶部快捷栏的期数显示
      if (latestDraw.period && window.updateCurrentPeriod) {
        updateCurrentPeriod(latestDraw.period);
      }
      
      if (latestDrawInfoElement) {
        latestDrawInfoElement.innerHTML = `
          <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
            期号: ${latestDraw.period}
          </div>
          <div>
            开奖日期: ${formattedDate}
          </div>
          <div>
            前区号码: ${Array.isArray(latestDraw.firstZoneNumbers) ? latestDraw.firstZoneNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ') : ''}
          </div>
          <div>
            后区号码: ${Array.isArray(latestDraw.lastZoneNumbers) ? latestDraw.lastZoneNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ') : ''}
          </div>`;
      }
    }
    
    // 渲染倒数第X期开奖信息到新增的区域
    async function xuan_ran_sql_dao_shu_x_qi() {
      const xLastDraw = await huo_qu_sql_dao_shu_x_qi();
      const xLastDrawInfoElement = document.getElementById('secondLastDrawInfo');
      
      if (!xLastDraw) {
        if (xLastDrawInfoElement) {
          xLastDrawInfoElement.innerHTML = '<div>接口失败</div>';
        }
        return;
      }
      
      // 处理日期格式，只显示年月日
      let formattedDate = xLastDraw.drawDate;
      if (formattedDate && typeof formattedDate === 'string') {
        // 处理ISO格式日期
        if (formattedDate.includes('T')) {
          formattedDate = formattedDate.split('T')[0];
        } else if (formattedDate.includes(' ')) {
          formattedDate = formattedDate.split(' ')[0];
        }

    // 渲染后区两球组合分析数据
    async function renderSecondZoneAnalysisData(period = '100') {
      // 获取后区两球组合分析数据

      if (!analysisData || !analysisData.combinations) {
        // 接口调用失败，不使用模拟数据
        return;
      }
      
      // 自己计算出现次数为0的号码作为推荐杀号
      // 收集所有可能的后区号码（1-12）
      const allPossibleNumbers = Array.from({length: 12}, (_, i) => (i + 1).toString());
      
      // 统计每个号码出现的总次数
      const numberCounts = {};
      allPossibleNumbers.forEach(num => {
        numberCounts[num] = 0;
      });
      
      // 计算每个号码的出现次数
      analysisData.combinations.forEach(combination => {
        if (combination.numberCounts) {
          Object.keys(combination.numberCounts).forEach(num => {
            if (numberCounts.hasOwnProperty(num)) {
              numberCounts[num] += combination.numberCounts[num];
            }
          });
        }
      });
      
      // 只选择出现次数为0的号码作为推荐杀号
      const killNumbers = Object.keys(numberCounts).filter(num => numberCounts[num] === 0);
      console.log('后区推荐杀号（出现次数为0）:', killNumbers);
      
      // 更新顶部推荐杀号区域 - 使用正确的元素ID
      const backKillNumbersElement = document.getElementById('back-kill-numbers');
      if (backKillNumbersElement) {
        if (killNumbers.length > 0) {
              backKillNumbersElement.innerHTML = killNumbers.map(num => 
                `<span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin: 3px; background-color: #DF2220; border-radius: 50%; font-size: 14px; color: #ffffff; font-weight: bold;">${num}</span>`
              ).join(' ');
            } else {
              backKillNumbersElement.textContent = '暂无推荐杀号';
            }
      }
      
      // 更新后区推荐杀号区块（卡片区域）
      const secondZoneKillNumbersElement = document.getElementById('secondZoneKillNumbers');
      if (secondZoneKillNumbersElement) {
        if (killNumbers.length > 0) {
          secondZoneKillNumbersElement.innerHTML = killNumbers.map(num => 
            `<span style="display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin: 3px; background-color: #DF2220; border-radius: 50%; font-size: 14px; color: #ffffff; font-weight: bold;">${num}</span>`
          ).join(' ');
        } else {
          secondZoneKillNumbersElement.textContent = '暂无推荐杀号';
        }
      }
      
      // 渲染后区两球组合统计
      const secondZoneCombinations = document.getElementById('secondZoneCombinations');
      secondZoneCombinations.innerHTML = ''; // 清空现有数据
      
      // 初始化汇总计数数组
      const totalCounts = new Array(13).fill(0); // 索引0不使用，1-12对应后区号码
      let totalOccurrences = 0; // 总出现次数
      
      console.log('渲染后区两球组合数据，共', analysisData.combinations.length, '个组合');
      
      // 为了更好的用户体验，先按照出现次数降序排序
      const sortedCombinations = [...analysisData.combinations].sort((a, b) => {
        // 直接使用后端提供的count字段
        return (b.count || 0) - (a.count || 0);
      });
      
      sortedCombinations.forEach(combo => {
        // 直接使用后端提供的count字段
        const totalCount = combo.count || 0;
        
        // 确保combo.combo是有效的
        const comboText = combo.combo && combo.combo !== 'NaN-NaN' ? combo.combo : '无效组合';
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="combination-cell" data-combination="${comboText}">${comboText}</td>
          <td class="count">${totalCount}</td>
        `;
        
        // 添加12个单元格，对应后区号码1-12

          const td = document.createElement('td');
          const numStr = String(i).padStart(2, '0'); // 使用两位格式的号码，与后端一致
          // 安全访问nextDrawNumbers属性
          let count = 0;
          if (combo.nextDrawNumbers && Array.isArray(combo.nextDrawNumbers)) {
            count = combo.nextDrawNumbers.filter(n => n === numStr).length;
          }
          
          // 累加汇总计数
          totalCounts[i] += count;
          
          // 当值为0时不显示，只显示大于0的统计值
          td.textContent = count > 0 ? count : '';
          
          // 只有当count大于0时才高亮显示
          if (count > 0) {
            td.className = 'highlight';
            
            // 添加一些视觉效果，根据count值设置不同的背景色深度
            const opacity = 0.2 + (count * 0.1); // 基础透明度0.2，每增加1次出现增加0.1的不透明度
            const clampedOpacity = Math.min(opacity, 0.9); // 最大不透明度为0.9
            td.style.backgroundColor = `rgba(96, 39, 39, ${clampedOpacity})`;
            td.style.color = '#fff';
            td.style.cursor = 'pointer'; // 添加鼠标指针样式

            // 为有统计值的单元格添加点击事件
            td.addEventListener('click', function() {
              const combination = combo.combo;

            // 添加鼠标悬停效果

              this.style.backgroundColor = 'rgba(96, 39, 39, 1)';

            });

          tr.appendChild(td);
        }
        
        // 累加总出现次数

        // 为组合号单元格添加点击事件
        const combinationCell = tr.querySelector('.combination-cell');
        combinationCell.addEventListener('click', function() {

        <td class="summary-cell">汇总</td>
        <td class="count summary-cell">${totalOccurrences}</td>
      `;

      for (let i = 1; i <= 12; i++) {
        const td = document.createElement('td');
        const count = totalCounts[i];

            td.textContent = count;

      }
      
      secondZoneCombinations.appendChild(summaryTr);
      
      // 添加排名行

      rankTr.className = 'summary-row';
      rankTr.innerHTML = `
        <td class="summary-cell">排名</td>
        <td class="count summary-cell"></td>
      `;
      
      // 计算排名
      const rankMap = {};
      const sortedNumbers = [];
      for (let i = 1; i <= 12; i++) {
        sortedNumbers.push({ number: i, count: totalCounts[i] || 0 });
      }
      // 按出现次数降序排序
      sortedNumbers.sort((a, b) => b.count - a.count);
      // 计算排名
      let currentRank = 1;
      for (let i = 0; i < sortedNumbers.length; i++) {
        if (i > 0 && sortedNumbers[i].count !== sortedNumbers[i - 1].count) {
          currentRank++;
        }
        rankMap[sortedNumbers[i].number] = currentRank;
      }
      
      // 添加12个排名单元格
      for (let i = 1; i <= 12; i++) {
        const td = document.createElement('td');
        const rank = rankMap[i];
        if (rank) {
          td.textContent = rank;
          td.className = 'highlight summary-highlight';
        }
        rankTr.appendChild(td);
      }
      
      secondZoneCombinations.appendChild(rankTr);
      
      // 绘制后区图表
      await drawBackZoneChart(totalCounts, period);
      // 更新全局汇总数据
      globalLastZoneTotalCounts = totalCounts;

        td.colSpan = 14; // 组合号 + 出现次数 + 12个号码

      }
      
      // 渲染后区推荐买号

      const lastZoneMostOccurrences = document.getElementById('lastZoneMostOccurrences');

        }

        mostOccurrenceNumbers.forEach(num => {

          lastZoneMostOccurrences.appendChild(ball);

        lastZoneMostOccurrences.textContent = '暂无数据';
      }
      
      // 2. 出现最少球：找到totalCounts中除0以外的最小值对应的号码
      const lastZoneLeastOccurrences = document.getElementById('lastZoneLeastOccurrences');
      lastZoneLeastOccurrences.innerHTML = '';

      const nonZeroCounts = totalCounts.filter(count => count > 0);
      if (nonZeroCounts.length > 0) {
        const minLastCount = Math.min(...nonZeroCounts);
        // 找出所有最小值对应的号码
        const leastOccurrenceNumbers = [];
        for (let i = 1; i <= 12; i++) {
          if (totalCounts[i] === minLastCount) {
            leastOccurrenceNumbers.push(i);
          }
        }
        // 渲染出现最少球
        leastOccurrenceNumbers.forEach(num => {
          const ball = document.createElement('span');

          ball.textContent = num;
          lastZoneLeastOccurrences.appendChild(ball);
        });
      } else {
        lastZoneLeastOccurrences.textContent = '暂无数据';
      }
      
      // 3. 出现平均球：找到totalCounts中次数等于平均值的号码
      const lastZoneAverageOccurrences = document.getElementById('lastZoneAverageOccurrences');
      lastZoneAverageOccurrences.innerHTML = '';
      // 计算后区号码的平均出现次数
      const nonZeroTotalCounts = totalCounts.filter(count => count > 0);
      if (nonZeroTotalCounts.length > 0) {
        const sumCounts = nonZeroTotalCounts.reduce((sum, count) => sum + count, 0);
        const averageCount = Math.round(sumCounts / nonZeroTotalCounts.length);
        // 找出所有等于平均值的号码
        const averageOccurrenceNumbers = [];
        for (let i = 1; i <= 12; i++) {
          if (totalCounts[i] === averageCount) {
            averageOccurrenceNumbers.push(i);
          }
        }
        // 渲染出现平均球
        if (averageOccurrenceNumbers.length > 0) {
          averageOccurrenceNumbers.forEach(num => {
            const ball = document.createElement('span');
            ball.className = 'blue-ball';
            ball.textContent = num;
            lastZoneAverageOccurrences.appendChild(ball);
          });
        } else {
          lastZoneAverageOccurrences.textContent = '暂无数据';
        }
      } else {
        lastZoneAverageOccurrences.textContent = '暂无数据';
      }
    }
    
    // 绘制前区图表
    async function drawFrontZoneChart(totalCounts, period) {
      try {
        const ctx = document.getElementById('firstZoneChart').getContext('2d');
        
        // 准备数据
        const labels = [];
        const data = [];
        for (let i = 1; i <= 35; i++) {
          labels.push(i);
          data.push(totalCounts[i] || 0);
        }
        
        // 根据排序方式重新排序数据
        const sortType = document.getElementById('firstZoneChartSort').value;
        if (sortType === 'count_asc') {
          // 按出现次数升序排序
          const sortedData = labels.map((label, index) => ({
            label,
            value: data[index]
          })).sort((a, b) => a.value - b.value);
          labels.length = 0;
          data.length = 0;
          sortedData.forEach(item => {
            labels.push(item.label);
            data.push(item.value);
          });
        } else if (sortType === 'count_desc') {
          // 按出现次数降序排序
          const sortedData = labels.map((label, index) => ({
            label,
            value: data[index]
          })).sort((a, b) => b.value - a.value);
          labels.length = 0;
          data.length = 0;
          sortedData.forEach(item => {
            labels.push(item.label);
            data.push(item.value);
          });
        }
        
        // 销毁现有图表
        if (window.firstZoneChart) {
          window.firstZoneChart.destroy();
        }
        
        // 创建新图表
        window.firstZoneChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '出现次数',
              data: data,
              backgroundColor: 'rgba(223, 34, 32, 0.7)',
              borderColor: 'rgba(223, 34, 32, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: '出现次数'
                }
              },
              x: {
                title: {
                  display: true,
                  text: '号码'
                }
              }
            },
            plugins: {
              title: {
                display: true,
                text: `前区号码出现次数分布（统计周期：${period}期）`
              }
            }
          }
        });
      } catch (error) {
        console.error('绘制前区图表失败:', error);
      }
    }

    // 复制杀号到剪贴板
    function copyKillNumbers(type) {
      let killNumbersElement;
      if (type === 'front') {
        killNumbersElement = document.getElementById('front-kill-numbers');
      } else {
        killNumbersElement = document.getElementById('back-kill-numbers');
      }
      
      if (killNumbersElement) {
        const text = killNumbersElement.textContent.trim();
        if (text && text !== '--' && text !== '暂无推荐杀号') {
          navigator.clipboard.writeText(text).then(() => {
            alert('杀号已复制到剪贴板');
          }).catch(err => {
            console.error('复制失败:', err);
            alert('复制失败，请手动复制');
          });
        } else {
          alert('暂无杀号数据可复制');
        }
      }
    }
