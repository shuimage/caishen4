<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轴线覆盖杀号号法回测测结果</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .period-input {
      width: 80px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }
    .period-input::-webkit-inner-spin-button,
    .period-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    body.dark-theme .period-input {
      background-color: #2d2d2d;
      border-color: #444;
      color: #fff;
    }
    body.dark-theme .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
    }

  </style>
  <script src="js/navigation.js"></script>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航?-->
      <div class="left-sidebar">
        <!-- 顶部快捷?-->
        <div class="top-bar">
          <div class="current-period">25120?/div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
          </ul>
        </nav>
      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">轴线覆盖杀号号法回测测结果</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='huan_yuan_jiu_zhuan_lian_huan_tu.html'">返回测</button>
          </div>
        </div>
    
        <!-- 回测测期数数据下一期拉选项 -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-start; flex-wrap: nowrap;">
          <div style="display: flex; align-items: flex-start; gap: 8px; white-space: nowrap;">
            <label for="backtestPeriod" style="line-height: 32px;">回测测期数数据?/label>
            <select id="backtestPeriod" class="period-dropdown">
              <option value="50">50?/option>
              <option value="100" selected>100?/option>
              <option value="200">200?/option>
              <option value="300">300?/option>
              <option value="500">500?/option>
              <option value="1000">1000?/option>
              <option value="all">全部?/option>
            </select>
          </div>
        </div>
    
    <!-- 回测测结果列表 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">杀号号回测测结?/h3>
          <div style="color: #DF2220;">
            <span id="backtestStats">共回测?期数，平均均正确率：0%</span>
          </div>
        </div>

        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>当前区回测测期数号</th>
                <th>前区区推荐杀号?/th>
                <th>推荐杀号号数据?/th>
                <th>下一期一期数开奖期数?/th>
                <th>下一期一期数实际开奖前区?/th>
                <th>前区区正确杀号号数据</th>
                <th>前区区错误杀号号数据</th>
                <th>是否成功杀号?/th>
              </tr>
            </thead>
            <tbody id="backtestResults">
              <!-- 数据据将通过JavaScript动态生?-->
              <tr>
                <td colspan="9" style="text-align: center; padding: 20px; color: #666;">加载?..</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 从URL参数据中奖获取回测测期数?    function getURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const backtestPeriod = urlParams.get('backtest_period') || '';
      return { backtestPeriod };
    }
    
    // 从后区端获取回测测数据?    async function huo_qu_huan_yuan_hui_ce_zhou_xian(backtestPeriod = '100', backtestMethod = 'most') {
      try {
        console.log('调用API参数据:', backtestPeriod, backtestMethod);
        // 调用轴线覆盖杀号号法的回测测API，使用默认值的backtestMethod=most
        const response = await fetch(`http://localhost:18889/huan_yuan_hui_ce_zhou_xian?backtest_period=${backtestPeriod}&stats_period=100&backtest_method=${backtestMethod}`);
        console.log('API响应:', response);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        console.log('API结果:', result);
        
        if (result.success) {
          return result.data;
        } else {
          console.error('接口返回测错误:', result.message);
          alert('接口失败败');
          return null;
        }
      } catch (error) {
        console.error('接口失败败:', error);
        alert('接口失败败');
        return null;
      }
    }
    
    // 获取全部期数数据
    async function getTotalPeriods() {
      try {
        const response = await fetch('http://localhost:18889/huo_qu_lottery_results_total');
        const result = await response.json();
        return result.success ? result.total : 1000;
      } catch (error) {
        console.error('获取全部期数数据失败败:', error);
        return 1000; // 默认值?      }
    }
    
    // 平均均率最低低功能主函数据
    function findLowestAccuracyStatsPeriod() {
      // 直接跳转到新页面，搜索逻辑在新页面中奖执行，使用默认值的backtest_method=most
      window.location.href = `ping_jun_lv_zui_di_detail.html?backtest_method=most&kill_type=zhou_xian`;
    }
    
    // 平均均率最低高功能主函数据
    function findHighestAccuracyStatsPeriod() {
      // 直接跳转到新页面，搜索逻辑在新页面中奖执行，使用默认值的backtest_method=most
      window.location.href = `ping_jun_lv_zui_gao_detail.html?backtest_method=most&kill_type=zhou_xian`;
    }
    
    // 渲染回测测数据据
    function renderBacktestData(backtestData) {
      const backtestResults = document.getElementById('backtestResults');
      const backtestStats = document.getElementById('backtestStats');
      
      if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
        backtestResults.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 20px; color: #666;">暂无回测测数据据</td></tr>';
        backtestStats.textContent = '共回测?期数，平均均正确率：0%';
        return;
      }
      
      // 计算平均均正确率（成功杀号号次数据?总回测测期数数据）
      let successKillCount = 0;
      
      backtestData.backtestResults.forEach(result => {
        // 统计计成功杀号号次数据数据（前区区正确杀号号数据 > 0?        const frontKillNumbers = result.recommendedKillNumbers || [];
        const nextFrontNumbers = result.nextFrontNumbers || [];
        const frontCorrectKill = frontKillNumbers.filter(num => !nextFrontNumbers.includes(num)).length;
        if (frontCorrectKill > 0) {
          successKillCount++;
        }
      });
      
      const totalPeriods = backtestData.backtestResults.length;
      const averageCorrectRate = totalPeriods > 0 ? 
        ((successKillCount / totalPeriods) * 100).toFixed(3) : 0;
      
      // 更新统计计信息
      backtestStats.textContent = `共回测?{backtestData.backtestResults.length}期数，平均均正确率：${averageCorrectRate}%`;
      
      // 渲染回测测列表
      backtestResults.innerHTML = '';
      
      backtestData.backtestResults.forEach((result, index) => {
        const tr = document.createElement('tr');
        
        // 格式化前区区推荐杀号?        const frontKillNumbers = result.recommendedKillNumbers || [];
        const frontKillNumbersStr = frontKillNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
        
        // 格式化下一期一期数实际开奖前区?        const nextFrontNumbers = result.nextFrontNumbers || [];
        const nextFrontNumbersStr = nextFrontNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ');
        
        // 计算正确杀号号数据和错误杀号号数据
        const frontCorrectKill = frontKillNumbers.filter(num => !nextFrontNumbers.includes(num)).length;
        const frontWrongKill = frontKillNumbers.filter(num => nextFrontNumbers.includes(num)).length;
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${result.period}?/td>
          <td>${frontKillNumbersStr}</td>
          <td>${frontKillNumbers.length}</td>
          <td>${result.nextPeriod}?/td>
          <td>${nextFrontNumbersStr}</td>
          <td style="color: green;">${frontCorrectKill}</td>
          <td style="color: red;">${frontWrongKill}</td>
          <td>
            ${frontCorrectKill > 0 ? 
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#4CAF50"/><path d="M7 12L10 15L17 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : 
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#F44336"/><path d="M8 8L16 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 8L8 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            }
          </td>
        `;
        
        backtestResults.appendChild(tr);
      });
    }
    
    // 获取并渲染回测测数据?    async function fetchAndRenderBacktestData(backtestPeriod = '100', backtestMethod = 'most') {
      const backtestData = await huo_qu_huan_yuan_hui_ce_zhou_xian(backtestPeriod, backtestMethod);
      renderBacktestData(backtestData);
    }
    
    // 保存回测测期数数据到localStorage
    function savePeriodSelection(backtestPeriod) {
      try {
        localStorage.setItem('backtestPeriod', backtestPeriod);
      } catch (e) {
        console.error('保存统计计范失败败:', e);
      }
    }
    
    // 从localStorage读取保存的回测测期数?    function getSavedPeriodSelection() {
      try {
        const backtestPeriod = localStorage.getItem('backtestPeriod') || '100';
        return { backtestPeriod };
      } catch (e) {
        console.error('读取统计计范失败败:', e);
        return { backtestPeriod: '100' };
      }
    }
    
    // 页面加载完成后区渲染数据?    window.addEventListener('load', async function() {
      // 首先从URL参数据中奖获取回测测期数?      const urlParams = getURLParameters();
      
      // 获取保存的回测测期数?      const savedParams = getSavedPeriodSelection();
      
      // 使用URL参数据优先于保存的参数据，最低后区使用默认值?      const backtestPeriod = urlParams.backtestPeriod || savedParams.backtestPeriod || '50';
      const backtestMethod = 'most'; // 使用默认值的回测测方?      
      // 获取下一期拉选项元素
      const backtestPeriodSelect = document.getElementById('backtestPeriod');
      
      // 设置下一期拉选项的初始?      backtestPeriodSelect.value = backtestPeriod;
      
      // 保存选择的回测测期数数据到localStorage
      savePeriodSelection(backtestPeriod);
      
      // 使用回测测期数数据获取回测测数据据
      fetchAndRenderBacktestData(backtestPeriod, backtestMethod);
      
      // 为回测测期数数据下一期拉选择框添加事件监听器
      backtestPeriodSelect.addEventListener('change', function() {
        const newBacktestPeriod = this.value;
        // 保存选择的回测测期数?        savePeriodSelection(newBacktestPeriod);
        // 根据选择的回测测期数数据获取回测测数据?        fetchAndRenderBacktestData(newBacktestPeriod, backtestMethod);
      });
    });
    
    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事?    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状?        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前区导航项的活动状?        this.classList.add('active');
        
        // 获取当前区点击项的文本内容
        const navText = this.textContent.trim();
        console.log('点击的导航项文本:', navText);
        
        // 使用更精确的匹配，优先检查特定的导航?    const navTextContent = this.querySelector('span:not(.nav-icon)') ? this.querySelector('span:not(.nav-icon)').textContent.trim() : this.querySelector('a').textContent.trim();
    console.log('点击的导航项文本:', navTextContent);
    
    if (navTextContent.includes('倒数数据3期数两球?)) {
      console.log('跳转到倒数数据3期数两球球组合合分析析页?);
      window.location.href = 'dao_shu_3_qi_liang_qiu_zu_he.html';
    } else if (navTextContent.includes('倒数数据2期数三球?)) {
      console.log('跳转到倒数数据2期数三球球组合合分析析页?);
      window.location.href = 'dao_shu_2_qi_san_qiu_zu_he.html';
    } else if (navTextContent.includes('倒数数据3期数三球?)) {
      console.log('跳转到倒数数据3期数三球球组合合分析析页?);
      window.location.href = 'dao_shu_3_qi_san_qiu_zu_he.html';
    } else if (navTextContent.includes('三球球')) {
      console.log('跳转到最低?期数三球球组合合分析析页?);
      window.location.href = 'san_qiu_fen_xi.html';
    } else if (navTextContent.includes('倒数数据2期数两球?)) {
      console.log('跳转到倒数数据2期数两球球组合合分析析页?);
      window.location.href = 'dao_shu_2_qi_liang_qiu_zu_he.html';
    } else if (navTextContent.includes('两球球组合合分析析')) {
      console.log('跳转到最低?期数两球球组合合分析析页?);
      window.location.href = 'zu_he_xiang_qing.html';
    } else if (navTextContent.includes('两球球')) {
      console.log('跳转到最低?期数两球球组合合分析析页?);
      window.location.href = 'sha_hao_fen_xi.html';
    }
        
        // 在移动端点击导航后区关闭侧边栏
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      });
    });
  </script>
</body>
</html>
