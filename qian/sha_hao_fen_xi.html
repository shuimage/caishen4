<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大乐透统计分析 - 杀号分析</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 手动输入期数样式 */
    .period-input {
      width: 100px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    

    .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }
    .period-input::-webkit-inner-spin-button,
    .period-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* 深色主题样式 */
    body.dark-theme .period-input {
      background-color: #2d2d2d;
      border-color: #444;
      color: #fff;
    }
    body.dark-theme .period-input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.3);
    }
    /* 调整期数选择区的布局 */
    .period-selection .period-dropdown {
      min-width: 120px;
    }
    
    /* 深色主题样式 */
    body.dark-theme .section,
    body.dark-theme .combination-table {
      background-color: #1a1a1a;
      color: #ffffff;
    }
    
    body.dark-theme .combination-table th,
    body.dark-theme .combination-table td {
      border-color: #333333;
    }
    
    body.dark-theme .highlight {
      background-color: rgba(96, 39, 39, 0.8) !important;
    }
    
    body.dark-theme .summary-row {
      background-color: #2d2d2d;
    }
    
    body.dark-theme .section-header {
      background-color: #2d2d2d;
      border-bottom-color: #333333;
    }
    
    body.dark-theme .period-dropdown {
      background-color: #2d2d2d;
      color: #ffffff;
      border-color: #444444;
    }
    
    body.dark-theme .btn {
      background-color: #2d2d2d;
      color: #ffffff;
      border-color: #444444;
    }
    
    body.dark-theme .btn:hover {
      background-color: #3d3d3d;
    }
  </style>
  <script src="js/navigation.js"></script>
  <script src="js/theme-toggle.js"></script>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航区 -->
      <div class="left-sidebar">
        <!-- 顶部快捷区 -->
        <div class="top-bar">
          <div class="current-period">25120期</div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
          </ul>
        </nav>
        
        <!-- 期数选择区 -->
        <div class="period-selection" style="position: relative; top: -400px;">
          <h4 class="section-title">选择统计范</h4>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <select class="period-dropdown">
              <option selected>最新100期</option>
              <option>最新50期</option>
              <option>最新35期</option>
              <option>最新200期</option>
              <option>最新300期</option>
              <option>最新500期</option>
              <option>最新1000期</option>
              <option>最新1500期</option>
              <option>最新2000期</option>
              <option>全部期</option>
            </select>
            <input type="number" id="customPeriod" class="period-input" placeholder="输入期数" min="1" max="5000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.3s, box-shadow 0.3s;">
          </div>
          <!-- 隐藏快捷期数按钮 -->
          <div class="quick-period-buttons" style="display: none;">
            <button class="quick-period-btn">近5期</button>
            <button class="quick-period-btn">近10期</button>
            <button class="quick-period-btn">最新一期</button>
          </div>
        </div>
        

      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">最新一期两球组合分析</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='index.html'">返回</button>
            <button id="themeToggle" class="theme-toggle" title="切换主题">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
          </div>
        </div>
    
    <!-- 主要内容区域 -->
      <div style="display: flex; gap: 20px; margin-bottom: 5px;">
        <!-- 最新开奖信息 -->
        <div class="section" style="flex: 1;">
          <h3>最新开奖信息</h3>
          <div id="latestDrawInfo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
        </div>
        
        <!-- 前区推荐买号 -->
        <div class="section" style="flex: 0.5;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>前区推荐买号：</h3>
            <div style="display: flex; gap: 8px;">
              <button class="backtest-btn" onclick="goToFrontBuyBacktestPage()" style="padding: 4px 8px; font-size: 12px; background-color: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 12a10 10 0 0 1 20 0M2 12a10 10 0 0 0 20 0"/></svg></button>
            </div>
          </div>
          <!-- 出现最多球 -->
          <div style="margin-top: 8px;">
            <span style="font-weight: bold;">出现最多球：</span>
            <div id="firstZoneMostOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
              <!-- 数据将通过JavaScript动态生成 -->
            </div>
          </div>
          <!-- 出现最少球 -->
          <div style="margin-top: 8px;">
            <span style="font-weight: bold;">出现最少球：</span>
            <div id="firstZoneLeastOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
              <!-- 数据将通过JavaScript动态生成 -->
            </div>
          </div>
          <!-- 出现平均数 -->
          <div style="margin-top: 8px;">
            <span style="font-weight: bold;">出现平均球：</span>
            <div id="firstZoneAverageOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
              <!-- 数据将通过JavaScript动态生成 -->
            </div>
          </div>
        </div>
        
        <!-- 后区推荐买号 -->
        <div class="section" style="flex: 0.5;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>后区推荐买号：</h3>
            <div style="display: flex; gap: 8px;">
              <button class="backtest-btn" onclick="goToBackBuyBacktestPage()" style="padding: 4px 8px; font-size: 12px; background-color: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 12a10 10 0 0 1 20 0M2 12a10 10 0 0 0 20 0"/></svg></button>
            </div>
          </div>
          <!-- 出现最多球 -->
          <div style="margin-top: 8px;">
            <span style="font-weight: bold;">出现最多球：</span>
            <div id="lastZoneMostOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
              <!-- 数据将通过JavaScript动态生成 -->
            </div>
          </div>
          <!-- 出现最少球 -->
          <div style="margin-top: 8px;">
            <span style="font-weight: bold;">出现最少球：</span>
            <div id="lastZoneLeastOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
              <!-- 数据将通过JavaScript动态生成 -->
            </div>
          </div>
          <!-- 出现平均数 -->
          <div style="margin-top: 8px;">
            <span style="font-weight: bold;">出现平均球：</span>
            <div id="lastZoneAverageOccurrences" style="display: inline-flex; flex-wrap: wrap; gap: 8px;">
              <!-- 数据将通过JavaScript动态生成 -->
            </div>
          </div>
        </div>
        
        <!-- 前区推荐杀号 -->
        <div class="section" style="flex: 0.5;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>前区推荐杀号：</h3>
            <div style="display: flex; gap: 8px;">
              <button class="copy-btn" onclick="copyKillNumbers('first')" style="padding: 4px 8px; font-size: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
              <button class="backtest-btn" onclick="goToBacktestPage()" style="padding: 4px 8px; font-size: 12px; background-color: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 12a10 10 0 0 1 20 0M2 12a10 10 0 0 0 20 0"/></svg></button>
            </div>
          </div>
          <div id="firstZoneRecommendations" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
        </div>
        
        <!-- 后区推荐杀号 -->
        <div class="section" style="flex: 0.5;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>后区推荐杀号：</h3>
            <div style="display: flex; gap: 8px;">
              <button class="copy-btn" onclick="copyKillNumbers('last')" style="padding: 4px 8px; font-size: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
              <button class="backtest-btn" onclick="goToBacktestHouPage()" style="padding: 4px 8px; font-size: 12px; background-color: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 12a10 10 0 0 1 20 0M2 12a10 10 0 0 0 20 0"/></svg></button>
            </div>
          </div>
          <div id="lastZoneRecommendations" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
        </div>
        
        <!-- 从未出现前区球杀号 -->
        <div class="section" style="flex: 0.5;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>从未出现前区球杀号：</h3>
            <div style="display: flex; gap: 8px;">
              <button class="copy-btn" onclick="copyNeverAppearedNumbers()" style="padding: 4px 8px; font-size: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
            </div>
          </div>
          <div id="neverAppearedNumbers" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
        </div>
      </div>
      
      <!-- 前区两球组合统计 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">前区两球组合统计</h3>
          <div style="color: #DF2220;">
            <!-- 统计信息将通过JavaScript动态生成 -->
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead id="firstZoneTableHeader">
              <tr>
                <th>组合：</th>
                <th>出现次数</th>
                <!-- 前区号码1-35将通过JavaScript动态生成 -->
              </tr>
            </thead>
            <tbody id="firstZoneCombinations">
              <!-- 数据将通过JavaScript动态生成 -->
            </tbody>
          </table>
        </div>
        
        <!-- 前区汇总数据图表 -->
        <div class="chart-container" style="margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h4>前区号码出现次数分布</h4>
            <div>
              <label style="margin-right: 10px;">图表排序：</label>
              <select id="firstZoneChartSort" style="padding: 5px;">
                <option value="number">按号码顺序</option>
                <option value="count_asc" selected>出现次数升序</option>
                <option value="count_desc">出现次数降序</option>
              </select>
            </div>
          </div>
          <canvas id="firstZoneChart" width="800" height="300"></canvas>
        </div>
      </div>
      
      <!-- 后区两球组合统计 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">后区两球组合统计</h3>
          <div style="color: #DF2220;">
            <!-- 统计信息将通过JavaScript动态生成 -->
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead id="lastZoneTableHeader">
              <tr>
                <th>组合：</th>
                <th>出现次数</th>
                <!-- 后区号码1-12将通过JavaScript动态生成 -->
              </tr>
            </thead>
            <tbody id="lastZoneCombinations">
              <!-- 数据将通过JavaScript动态生成 -->
            </tbody>
          </table>
        </div>
        
        <!-- 后区汇总数据图表 -->
        <div class="chart-container" style="margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h4>后区号码出现次数分布</h4>
            <div>
              <label style="margin-right: 10px;">图表排序：</label>
              <select id="lastZoneChartSort" style="padding: 5px;">
                <option value="number">按号码顺序</option>
                <option value="count_asc" selected>出现次数升序</option>
                <option value="count_desc">出现次数降序</option>
              </select>
            </div>
          </div>
          <canvas id="lastZoneChart" width="800" height="300"></canvas>
        </div>
      </div>
      
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sha_hao_fen_xi.js"></script>
</body>
</html>
