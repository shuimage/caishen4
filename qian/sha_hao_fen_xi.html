<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大乐透统计分析 - 杀号分析</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧导航栏 -->
      <div class="left-sidebar">
        <!-- 顶部快捷栏 -->
        <div class="top-bar">
          <div class="current-period">25120期</div>
        </div>
        
        <!-- 主导航区 -->
        <nav class="main-nav">
          <ul>
            <li class="nav-item active">
              <span class="nav-icon">✕</span>
              <span onclick="window.location.href='zu_he_xiang_qing.html'">最新1期两球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">✖️</span>
              <span onclick="window.location.href='dao_shu_2_qi_liang_qiu_zu_he.html'">倒数2期两球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">✗</span>
              <a href="dao_shu_3_qi_liang_qiu_zu_he.html" style="text-decoration: none; color: inherit;">倒数3期两球组合分析</a>
            </li>
            <li class="nav-item">
              <span class="nav-icon">🔺</span>
              <span onclick="window.location.href='san_qiu_fen_xi.html'">最新1期三球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">🔻</span>
              <span onclick="window.location.href='dao_shu_2_qi_san_qiu_zu_he.html'">倒数2期三球组合分析</span>
            </li>
            <li class="nav-item">
              <span class="nav-icon">🔽</span>
              <a href="dao_shu_3_qi_san_qiu_zu_he.html" style="text-decoration: none; color: inherit;">倒数3期三球组合分析</a>
            </li>

          </ul>
        </nav>
        
        <!-- 期数选择区 -->
        <div class="period-selection" style="position: relative; top: -400px;">
          <h4 class="section-title">选择统计范围</h4>
          <select class="period-dropdown">
            <option selected>最近100期</option>
            <option>最近50期</option>
            <option>最近35期</option>
            <option>最近200期</option>
            <option>最近300期</option>
            <option>最近500期</option>
            <option>最近1000期</option>
            <option>全部期</option>
          </select>
          <!-- 隐藏快捷期数按钮 -->
          <div class="quick-period-buttons" style="display: none;">
            <button class="quick-period-btn">近5期</button>
            <button class="quick-period-btn">近10期</button>
            <button class="quick-period-btn">最新1期</button>
          </div>
        </div>
        

      </div>
      
      <!-- 右侧主内容区 -->
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-title">最新1期两球组合分析</h1>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn back-btn" onclick="window.location.href='index.html'">返回</button>
          </div>
        </div>
    
    <!-- 主要内容区域 -->
      <div style="display: flex; gap: 20px; margin-bottom: 5px;">
        <!-- 最新开奖信息 -->
        <div class="section" style="flex: 1;">
          <h3>最新开奖信息</h3>
          <div id="latestDrawInfo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
        </div>
        
        <!-- 前区推荐杀号 -->
        <div class="section" style="flex: 0.5;">
          <h3>前区推荐杀号：</h3>
          <div id="firstZoneRecommendations" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
          <div style="margin-top: 10px; color: #DF2220; cursor: pointer; text-decoration: underline;" onclick="goToBacktestPage()">查看回测结果</div>
        </div>
        
        <!-- 后区推荐杀号 -->
        <div class="section" style="flex: 0.5;">
          <h3>后区推荐杀号：</h3>
          <div id="lastZoneRecommendations" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
            <!-- 数据将通过JavaScript动态生成 -->
          </div>
          <div style="margin-top: 10px; color: #DF2220; cursor: pointer; text-decoration: underline;" onclick="goToBacktestHouPage()">查看回测结果</div>
        </div>
      </div>
      
      <!-- 前区两球组合统计 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">前区两球组合统计</h3>
          <div style="color: #DF2220;">
            <!-- 统计信息将通过JavaScript动态生成 -->
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead id="firstZoneTableHeader">
              <tr>
                <th>组合号</th>
                <th>出现次数</th>
                <!-- 前区号码1-35将通过JavaScript动态生成 -->
              </tr>
            </thead>
            <tbody id="firstZoneCombinations">
              <!-- 数据将通过JavaScript动态生成 -->
            </tbody>
          </table>
        </div>
      </div>
      
      <!-- 后区两球组合统计 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">后区两球组合统计</h3>
          <div style="color: #DF2220;">
            <!-- 统计信息将通过JavaScript动态生成 -->
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead id="lastZoneTableHeader">
              <tr>
                <th>组合号</th>
                <th>出现次数</th>
                <!-- 后区号码1-12将通过JavaScript动态生成 -->
              </tr>
            </thead>
            <tbody id="lastZoneCombinations">
              <!-- 数据将通过JavaScript动态生成 -->
            </tbody>
          </table>
        </div>
      </div>
      
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 从接口获取最新开奖信息
    async function huo_qu_zui_xin_kai_jiang() {
      try {
        const response = await fetch('http://localhost:18889/sql_zui_xin_yi_qi');
        const result = await response.json();
        
        if (result.success) {
          return result.latestDraw;
        } else {
          alert('接口失败');
          return null;
        }
      } catch (error) {
        console.error('获取最新开奖信息失败:', error);
        alert('接口失败');
        return null;
      }
    }
    
    // 从后端获取最新1期杀号分析数据
    async function huo_qu_shuang_sha_fen_xi(period = '100') {
      try {
        const response = await fetch(`http://localhost:18889/shuang_sha_fen_xi?period=${period}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
          
          if (result.success) {
            return result.data;
          } else {
            alert('获取杀号分析数据失败：' + result.message);
            return null;
          }
        } catch (error) {
          console.error('获取杀号分析数据失败:', error);
          alert('获取杀号分析数据失败');
          return null;
        }
    }
    
    // 渲染杀号分析数据
    async function renderKillAnalysisData(period = '100') {
      // 获取双杀分析数据
      const analysisData = await huo_qu_shuang_sha_fen_xi(period);
      
      if (!analysisData) {
        // 接口调用失败，不使用模拟数据
        return;
      }
      
      // 渲染最新开奖信息
      const latestDraw = analysisData.latestDraw;
      // 更新顶部快捷栏的期数显示
      updateCurrentPeriod(latestDraw.issue);
      // 处理日期格式，只显示年月日
      let formattedDate = latestDraw.drawDate;
      if (formattedDate && typeof formattedDate === 'string') {
        // 处理ISO格式日期（如：2025-10-28T16:00:00.000Z）
        if (formattedDate.includes('T')) {
          formattedDate = formattedDate.split('T')[0];
        }
        // 处理包含空格的日期（如：2025-10-28 16:00:00）
        else if (formattedDate.includes(' ')) {
          formattedDate = formattedDate.split(' ')[0];
        }
      }
      const latestDrawInfo = document.getElementById('latestDrawInfo');
      latestDrawInfo.innerHTML = `
        <div style="font-weight: bold; color: #DF2220; font-size: 16px;">
          期号: ${latestDraw.issue}
        </div>
        <div>
          开奖日期: ${formattedDate}
        </div>
        <div>
          前区号码: ${latestDraw.frontNumbers.map(num => `<span class="red-ball">${num}</span>`).join(' ')}
        </div>
        <div>
          后区号码: ${latestDraw.backNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ')}
        </div>
      `;
      
      // 渲染前区两球组合统计
      const firstZoneCombinations = document.getElementById('firstZoneCombinations');
      firstZoneCombinations.innerHTML = ''; // 清空现有数据
      
      analysisData.frontCombinations.forEach(combo => {
        const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${combo.combination}</td>
            <td class="count" style="background-color: #cce5ff;">${combo.nextDrawNumbers?.length || 0}</td>
          `;
        
        // 添加35个单元格，对应前区号码1-35
        for (let i = 1; i <= 35; i++) {
          const td = document.createElement('td');
          const count = combo.numberCounts[i] || 0;
          
          if (count > 0) {
              td.textContent = count;
              td.className = 'highlight';
              td.onclick = () => goToCombinationDetail(`${combo.combination}-${String(i).padStart(2, '0')}`, 'first', periodValue);
            }
          
          tr.appendChild(td);
        }
        
        firstZoneCombinations.appendChild(tr);
      });
      
      // 渲染后区两球组合统计
      const lastZoneCombinations = document.getElementById('lastZoneCombinations');
      lastZoneCombinations.innerHTML = ''; // 清空现有数据
      
      analysisData.backCombinations.forEach(combo => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${combo.combination}</td>
          <td class="count" style="background-color: #cce5ff;">${combo.nextDrawNumbers?.length || 0}</td>
        `;
        
        // 添加12个单元格，对应后区号码1-12
        for (let i = 1; i <= 12; i++) {
          const td = document.createElement('td');
          const count = combo.numberCounts[i] || 0;
          
          if (count > 0) {
              td.textContent = count;
              td.className = 'highlight';
              td.onclick = () => goToCombinationDetail(`${combo.combination}-${String(i).padStart(2, '0')}`, 'last', periodValue);
            }
          
          tr.appendChild(td);
        }
        
        lastZoneCombinations.appendChild(tr);
      });
      
      // 渲染推荐杀号
      const firstZoneRecommendations = document.getElementById('firstZoneRecommendations');
      firstZoneRecommendations.innerHTML = '';
      if (analysisData.recommendedFrontKillNumbers && analysisData.recommendedFrontKillNumbers.length > 0) {
        analysisData.recommendedFrontKillNumbers.forEach(num => {
          const ball = document.createElement('span');
          ball.className = 'red-ball';
          ball.textContent = num;
          firstZoneRecommendations.appendChild(ball);
        });
      } else {
        firstZoneRecommendations.textContent = '暂无推荐杀号';
      }
      
      const lastZoneRecommendations = document.getElementById('lastZoneRecommendations');
      lastZoneRecommendations.innerHTML = '';
      if (analysisData.recommendedBackKillNumbers && analysisData.recommendedBackKillNumbers.length > 0) {
        analysisData.recommendedBackKillNumbers.forEach(num => {
          const ball = document.createElement('span');
          ball.className = 'blue-ball';
          ball.textContent = num;
          lastZoneRecommendations.appendChild(ball);
        });
      } else {
        lastZoneRecommendations.textContent = '暂无推荐杀号';
      }
      
      // 更新统计信息
      const firstZoneSection = document.querySelector('.section');
      if (firstZoneSection && firstZoneSection.querySelector('.section-header')) {
        firstZoneSection.querySelector('.section-header').innerHTML = `
          <h3 style="margin: 0;">前区两球组合统计</h3>
          <div style="color: #DF2220;">
            共有${analysisData.frontCombinations.length}种前区两球组合，
            ${analysisData.frontCombinations.filter(c => c.nextDrawNumbers.length > 0).length}种组合在历史下期出现过号码
          </div>
        `;
      }
      
      if (analysisData.backCombinations.length > 0) {
        const lastCombo = analysisData.backCombinations[0];
        const backZoneSections = document.querySelectorAll('.section');
        if (backZoneSections.length > 2 && backZoneSections[2].querySelector('.section-header')) {
          backZoneSections[2].querySelector('.section-header').innerHTML = `
            <h3 style="margin: 0;">后区两球组合统计</h3>
            <div style="color: #DF2220;">
              最新开奖后区两球组合：${lastCombo.combination} 历史下期出现过${lastCombo.nextDrawNumbers.length}次相关号码
            </div>
          `;
        }
      }
    }
    
    // 渲染表格头部
    function renderTableHeaders() {
      // 渲染前区表格头部
      const firstZoneHeader = document.getElementById('firstZoneTableHeader');
      const firstZoneRow = firstZoneHeader.querySelector('tr');
      for (let i = 1; i <= 35; i++) {
        const th = document.createElement('th');
        th.textContent = String(i).padStart(2, '0');
        firstZoneRow.appendChild(th);
      }
      
      // 渲染后区表格头部
      const lastZoneHeader = document.getElementById('lastZoneTableHeader');
      const lastZoneRow = lastZoneHeader.querySelector('tr');
      for (let i = 1; i <= 12; i++) {
        const th = document.createElement('th');
        th.textContent = String(i).padStart(2, '0');
        lastZoneRow.appendChild(th);
      }
    }
    
    // 更新顶部快捷栏的期数显示
    function updateCurrentPeriod(period) {
      document.querySelector('.current-period').textContent = period;
    }
    
    // 保存统计范围到localStorage
    function savePeriodSelection(periodValue) {
      try {
        localStorage.setItem('selectedPeriodRange', periodValue);
      } catch (e) {
        console.error('保存统计范围失败:', e);
      }
    }
    
    // 从localStorage读取保存的统计范围
    function getSavedPeriodSelection() {
      try {
        return localStorage.getItem('selectedPeriodRange') || '100';
      } catch (e) {
        console.error('读取统计范围失败:', e);
        return '100';
      }
    }
    
    // 根据period值设置下拉框选中状态
    function setPeriodDropdownSelection(periodValue) {
      const periodDropdown = document.querySelector('.period-dropdown');
      if (periodDropdown) {
        if (periodValue === '100') periodDropdown.value = '最近100期';
        else if (periodValue === '50') periodDropdown.value = '最近50期';
        else if (periodValue === '35') periodDropdown.value = '最近35期';
        else if (periodValue === '200') periodDropdown.value = '最近200期';
        else if (periodValue === '300') periodDropdown.value = '最近300期';
        else if (periodValue === '500') periodDropdown.value = '最近500期';
        else if (periodValue === '1000') periodDropdown.value = '最近1000期';
        else if (periodValue === 'all') periodDropdown.value = '全部期';
      }
    }
    
    // 定义全局变量用于存储当前选择的统计范围
    let periodValue = '100'; // 默认值
    
    // 页面加载完成后渲染数据
    window.addEventListener('load', async function() {
      renderTableHeaders();
      
      // 获取保存的统计范围，如果没有则使用默认值100
      periodValue = getSavedPeriodSelection();
      
      // 设置下拉框选中状态
      setPeriodDropdownSelection(periodValue);
      
      // 使用保存的统计范围渲染数据
      renderKillAnalysisData(periodValue);
      
      // 为统计范围下拉选择框添加事件监听器
      const periodDropdown = document.querySelector('.period-dropdown');
      if (periodDropdown) {
        periodDropdown.addEventListener('change', function() {
          const selectedText = this.value;
          
          // 根据选择的文本确定对应的period值
          if (selectedText === '最近100期') periodValue = '100';
          else if (selectedText === '最近50期') periodValue = '50';
          else if (selectedText === '最近35期') periodValue = '35';
          else if (selectedText === '最近200期') periodValue = '200';
          else if (selectedText === '最近300期') periodValue = '300';
          else if (selectedText === '最近500期') periodValue = '500';
          else if (selectedText === '最近1000期') periodValue = '1000';
          else if (selectedText === '全部期') periodValue = 'all';
          // 自定义期数选项已移除
          
          // 保存选择的统计范围
          savePeriodSelection(periodValue);
          
          // 根据选择的统计范围重新渲染数据
          renderKillAnalysisData(periodValue);
        });
      }
      
      // 快捷期数按钮已隐藏，移除相关事件监听器
      
    });
    
    // 跳转到前区回测页面
    function goToBacktestPage() {
      const statsPeriod = getSelectedStatsRange();
      window.location.href = `sha_hao_hui_ce_xiang_qing.html?backtest_period=50&stats_period=${statsPeriod}`;
    }
    
    // 跳转到后区回测页面
    function goToBacktestHouPage() {
      const statsPeriod = getSelectedStatsRange();
      window.location.href = `sha_hao_hui_ce_hou_xiang_qing.html?backtest_period=50&stats_period=${statsPeriod}`;
    }
    
    // 获取当前选择的统计范围期数
    function getSelectedStatsRange() {
      const periodDropdown = document.querySelector('.period-dropdown');
      if (periodDropdown) {
        const selectedText = periodDropdown.value;
        if (selectedText === '最近100期') return '100';
        else if (selectedText === '最近50期') return '50';
        else if (selectedText === '最近35期') return '35';
        else if (selectedText === '最近200期') return '200';
        else if (selectedText === '最近300期') return '300';
        else if (selectedText === '最近500期') return '500';
        else if (selectedText === '最近1000期') return '1000';
        else if (selectedText === '全部期') return 'all';
      }
      return '100'; // 默认值
    }
    
    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事件 - 只处理没有<a>标签的导航项，避免与默认<a>标签事件冲突
    document.querySelectorAll('.nav-item').forEach(item => {
      // 检查当前导航项是否包含<a>标签，如果包含则跳过，使用<a>标签的默认行为
      const hasLink = item.querySelector('a') !== null;
      if (hasLink) {
        return; // 跳过包含<a>标签的导航项
      }
      
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状态
        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前导航项的活动状态
        this.classList.add('active');
        
        // 获取当前点击项的文本内容
        const navText = this.textContent.trim();
        console.log('点击的导航项文本:', navText);
        
        // 使用更精确的匹配，优先检查特定的导航项
        const navTextContent = this.querySelector('span:not(.nav-icon)') ? this.querySelector('span:not(.nav-icon)').textContent.trim() : '';
        console.log('点击的导航项文本:', navTextContent);
        
        if (navTextContent.includes('倒数3期两球')) {
          console.log('跳转到倒数3期两球组合分析页面');
          window.location.href = 'dao_shu_3_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数2期三球')) {
          console.log('跳转到倒数2期三球组合分析页面');
          window.location.href = 'dao_shu_2_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('倒数3期三球')) {
          console.log('跳转到倒数3期三球组合分析页面');
          window.location.href = 'dao_shu_3_qi_san_qiu_zu_he.html';
        } else if (navTextContent.includes('三球')) {
          console.log('跳转到最新1期三球组合分析页面');
          window.location.href = 'san_qiu_fen_xi.html';
        } else if (navTextContent.includes('倒数2期两球')) {
          console.log('跳转到倒数2期两球组合分析页面');
          window.location.href = 'dao_shu_2_qi_liang_qiu_zu_he.html';
        } else if (navTextContent.includes('两球组合分析') || navTextContent.includes('两球')) {
          console.log('跳转到最新1期两球组合分析页面');
          window.location.href = 'sha_hao_fen_xi.html';
        }
        
        // 在移动端点击导航后关闭侧边栏
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      });
    });
  </script>
</body>
</html>
