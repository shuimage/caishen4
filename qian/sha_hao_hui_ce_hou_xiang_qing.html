    <!-- 回测结果列表 -->
      <div class="section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">杀号回测结果</h3>
          <div style="color: #DF2220;">
            <span id="backtestStats">共回测0期，平均正确率：0%</span>
          </div>
        </div>
        <div style="overflow-x: auto;">
          <table class="combination-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>当前期号</th>
                <th>后区推荐杀号</th>
                <th>下一期开奖期号</th>
                <th>下一期实际开奖后区</th>
                <th>正确杀号</th>
                <th>错误杀号</th>
              </tr>
            </thead>
            <tbody id="backtestResults">
              <!-- 数据将通过JavaScript动态生成 -->
              <tr>
                <td colspan="7" style="text-align: center; padding: 20px; color: #666;">加载中...</td>
              </tr>
            </tbody>
          </table>

  <script src="js/data.js"></script>
  <script>
    // 主题切换功能 - 仅从localStorage读取设置，不在此页面提供切换按钮
    document.addEventListener('DOMContentLoaded', function() {
      // 从localStorage读取主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-theme');
      }
    });
  </script>
  <script>
    // 从URL参数中获取回测期数和统计期数
    function getURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const backtestPeriod = urlParams.get('backtest_period') || '';
      const statsPeriod = urlParams.get('stats_period') || '';
      return { backtestPeriod, statsPeriod };
    }
    
    // 从后端获取回测数据
    async function huo_qu_sha_hao_hou_hui_ce(backtestPeriod = '100', statsPeriod = '100') {
      try {
        const response = await fetch(`http://localhost:18889/huo_qu_sha_hao_hou_hui_ce?backtest_period=${backtestPeriod}&stats_period=${statsPeriod}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const result = await response.json();
        
        if (result.success) {
          return result.data;
        } else {
          alert('获取回测数据失败：' + result.message);
          return null;
        }
      } catch (error) {
        console.error('获取回测数据失败:', error);
        alert('获取回测数据失败');
        return null;
      }
    }
    
    // 渲染回测数据
    function renderBacktestData(backtestData) {
      const backtestResults = document.getElementById('backtestResults');
      const backtestStats = document.getElementById('backtestStats');
      
      if (!backtestData || !backtestData.backtestResults || backtestData.backtestResults.length === 0) {
        backtestResults.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #666;">暂无回测数据</td></tr>';
        backtestStats.textContent = '共回测0期，平均正确率：0%';
        return;
      }
      
      // 计算平均正确率
      let totalBackCorrectKill = 0;
      let totalBackKillNumbers = 0;
      
      backtestData.backtestResults.forEach(result => {
        totalBackCorrectKill += result.backCorrectKill;
        totalBackKillNumbers += result.backKillNumbers.length;
      });
      
      const averageCorrectRate = totalBackKillNumbers > 0 ? 
        ((totalBackCorrectKill / totalBackKillNumbers) * 100).toFixed(2) : 0;
      
      // 更新统计信息
      backtestStats.textContent = `共回测${backtestData.backtestResults.length}期，平均正确率：${averageCorrectRate}%`;
      
      // 渲染回测列表
      backtestResults.innerHTML = '';
      
      backtestData.backtestResults.forEach((result, index) => {
        const tr = document.createElement('tr');
        
        // 格式化后区推荐杀号
        const backKillNumbersStr = result.backKillNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ');
        
        // 格式化下一期实际开奖后区
        const nextBackNumbersStr = result.nextBackNumbers.map(num => `<span class="blue-ball">${num}</span>`).join(' ');
        
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${result.currentIssue}</td>
          <td>${backKillNumbersStr}</td>
          <td>${result.nextIssue}</td>
          <td>${nextBackNumbersStr}</td>
          <td style="color: green;">${result.backCorrectKill}</td>
          <td style="color: red;">${result.backWrongKill}</td>
        `;
        
        backtestResults.appendChild(tr);
      });
    }
    
    // 获取并渲染回测数据
    async function fetchAndRenderBacktestData(backtestPeriod = '100', statsPeriod = '100') {
      const backtestData = await huo_qu_sha_hao_hou_hui_ce(backtestPeriod, statsPeriod);
      renderBacktestData(backtestData);
    }
    
    // 保存回测期数和统计期数到localStorage
    function savePeriodSelection(backtestPeriod, statsPeriod) {
      try {
        localStorage.setItem('backtestPeriod', backtestPeriod);
        localStorage.setItem('statsPeriod', statsPeriod);
      } catch (e) {
        console.error('保存统计范围失败:', e);
      }
    }
    
    // 从localStorage读取保存的回测期数和统计期数
    function getSavedPeriodSelection() {
      try {
        const backtestPeriod = localStorage.getItem('backtestPeriod') || '100';
        const statsPeriod = localStorage.getItem('statsPeriod') || '100';
        return { backtestPeriod, statsPeriod };
      } catch (e) {
        console.error('读取统计范围失败:', e);
        return { backtestPeriod: '100', statsPeriod: '100' };
      }
    }
    
    // 页面加载完成后渲染数据
    window.addEventListener('load', async function() {
      // 首先从URL参数中获取回测期数和统计期数
      const urlParams = getURLParameters();
      
      // 获取保存的回测期数和统计期数
      const savedParams = getSavedPeriodSelection();
      
      // 使用URL参数优先于保存的参数，最后使用默认值
      const backtestPeriod = urlParams.backtestPeriod || savedParams.backtestPeriod || '50';
      const statsPeriod = urlParams.statsPeriod || savedParams.statsPeriod || '100';
      
      // 获取下拉选项元素
      const backtestPeriodSelect = document.getElementById('backtestPeriod');
      const statsPeriodSelect = document.getElementById('statsPeriod');
      
      // 设置下拉选项的初始值
      backtestPeriodSelect.value = backtestPeriod;
      statsPeriodSelect.value = statsPeriod;
      
      // 保存选择的回测期数和统计期数到localStorage
      savePeriodSelection(backtestPeriod, statsPeriod);
      
      // 使用回测期数和统计期数获取回测数据
      fetchAndRenderBacktestData(backtestPeriod, statsPeriod);
      
      // 为回测期数下拉选择框添加事件监听器
      backtestPeriodSelect.addEventListener('change', function() {
        const newBacktestPeriod = this.value;
        const currentStatsPeriod = statsPeriodSelect.value;
        // 保存选择的回测期数和统计期数
        savePeriodSelection(newBacktestPeriod, currentStatsPeriod);
        // 根据选择的回测期数和统计期数重新获取回测数据
        fetchAndRenderBacktestData(newBacktestPeriod, currentStatsPeriod);
      });
      
      // 为统计期数下拉选择框添加事件监听器
      statsPeriodSelect.addEventListener('change', function() {
        const newStatsPeriod = this.value;
        const currentBacktestPeriod = backtestPeriodSelect.value;
        // 保存选择的回测期数和统计期数
        savePeriodSelection(currentBacktestPeriod, newStatsPeriod);
        // 根据选择的回测期数和统计期数重新获取回测数据
        fetchAndRenderBacktestData(currentBacktestPeriod, newStatsPeriod);
      });
    });
    
    // 移动端侧边栏切换
    function toggleSidebar() {
      const sidebar = document.querySelector('.left-sidebar');
      sidebar.classList.toggle('open');
    }
    
    // 导航项点击事件
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        // 移除所有导航项的活动状态
        document.querySelectorAll('.nav-item').forEach(navItem => {
          navItem.classList.remove('active');
        });
        // 添加当前导航项的活动状态
        this.classList.add('active');
        
        // 获取当前点击项的文本内容
        const navText = this.textContent.trim();
        console.log('点击的导航项文本:', navText);
        
        // 使用更精确的匹配，优先检查特定的导航项
    const navTextContent = this.querySelector('span:not(.nav-icon)') ? this.querySelector('span:not(.nav-icon)').textContent.trim() : this.querySelector('a').textContent.trim();
    console.log('点击的导航项文本:', navTextContent);
    
    if (navTextContent.includes('倒数3期两球')) {
      console.log('跳转到倒数3期两球组合分析页面');
      window.location.href = 'dao_shu_3_qi_liang_qiu_zu_he.html';
    } else if (navTextContent.includes('倒数2期三球')) {
      console.log('跳转到倒数2期三球组合分析页面');
      window.location.href = 'dao_shu_2_qi_san_qiu_zu_he.html';
    } else if (navTextContent.includes('倒数3期三球')) {
      console.log('跳转到倒数3期三球组合分析页面');
      window.location.href = 'dao_shu_3_qi_san_qiu_zu_he.html';
    } else if (navTextContent.includes('三球')) {
      console.log('跳转到最新1期三球组合分析页面');
      window.location.href = 'san_qiu_fen_xi.html';
    } else if (navTextContent.includes('倒数2期两球')) {
      console.log('跳转到倒数2期两球组合分析页面');
      window.location.href = 'dao_shu_2_qi_liang_qiu_zu_he.html';
    } else if (navTextContent.includes('两球组合分析')) {
      console.log('跳转到最新1期两球组合分析页面');
      window.location.href = 'zu_he_xiang_qing.html';
    } else if (navTextContent.includes('两球')) {
      console.log('跳转到最新1期两球组合分析页面');
      window.location.href = 'sha_hao_fen_xi.html';
    }
        
        // 在移动端点击导航后关闭侧边栏
        if (window.innerWidth <= 768) {
          toggleSidebar();
        }
      });
    });
  </script>
