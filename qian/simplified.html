<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简化版杀号分析</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">最新一期两球组合分析</h1>
        <p>这是一个简化版的杀号分析页面，用于测试异步函数调用</p>
    </div>

    <script src="js/data.js"></script>
    <script>
        // 简化版的renderKillAnalysisData函数
        async function renderKillAnalysisData(period = '100') {
            try {
                console.log('开始渲染杀号分析数据，期数:', period);
                // 这里可以添加更多代码进行测试
                return true;
            } catch (error) {
                console.error('渲染杀号分析数据失败:', error);
                return false;
            }
        }

        // 页面加载完成后渲染数据
        window.addEventListener('load', async function() {
            console.log('页面加载完成，开始渲染数据');
            const result = await renderKillAnalysisData();
            console.log('渲染结果:', result);
        });
    </script>
</body>
</html>
